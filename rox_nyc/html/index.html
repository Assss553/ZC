<!DOCTYPE html><html><head><meta charset="utf-8"><title>ROX NYC Shop</title><style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}body{font-family:"Segoe UI",Tahoma,sans-serif;color:#fff;background:transparent;overflow:hidden}
.hidden{display:none!important}#app{position:fixed;inset:0;display:grid;place-items:center;background:#0008}
.panel{width:820px;max-height:620px;border-radius:24px;background:linear-gradient(160deg,#1b1d23,#0e0f13);border:1px solid #ffffff1c;box-shadow:0 40px 120px #000c;display:flex;flex-direction:column;overflow:hidden;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
header{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid #ffffff12}header i{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#ff8a4c,#ff3d10);display:grid;place-items:center;font-style:normal;font-weight:900}
header b{font-size:22px;flex:1}header button{background:#ffffff14;border:0;color:#fff;width:34px;height:34px;border-radius:10px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:18px 22px;overflow:auto}
.it{background:#ffffff08;border:1px solid #ffffff14;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.it .ic{width:64px;height:64px;border-radius:16px;background:radial-gradient(circle at 35% 30%,#ff9a5c,#c2410c);display:grid;place-items:center;font-size:30px}
.it b{font-size:15px}.it .p{color:#ffb08a;font-weight:800}.q{display:flex;align-items:center;gap:10px}.q button{width:30px;height:30px;border-radius:9px;border:0;background:#ffffff18;color:#fff;font-size:18px;cursor:pointer}.q span{min-width:20px;font-weight:800}
footer{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-top:1px solid #ffffff12}footer .t{font-size:22px;font-weight:900}
footer button{background:linear-gradient(135deg,#ff7a3c,#ff3d10);border:0;color:#fff;font-weight:800;font-size:18px;padding:12px 30px;border-radius:14px;cursor:pointer}footer button:disabled{opacity:.4}
</style></head><body><div id="app" class="hidden"><div class="panel"><header><i>R</i><b id="title"></b><button id="x">✕</button></header><div class="grid" id="grid"></div>
<footer><div class="t" id="total">$0</div><button id="buy"></button></footer></div></div>
<script>
const $=(q)=>document.querySelector(q), RES=typeof GetParentResourceName==='function'?GetParentResourceName():'rox_nyc';
const post=(n,d={})=>fetch(`https://${RES}/${n}`,{method:'POST',body:JSON.stringify(d)}).catch(()=>{});
const EMO={water:'💧',sandwich:'🥪',chips:'🥔',cola:'🥤',coffee:'☕',phone:'📱',lighter:'🔥',bandage:'🩹',painkillers:'💊',firstaid:'🧰',pizza_slice:'🍕',pizza:'🍕',burger:'🍔',fries:'🍟',milkshake:'🥤',latte:'☕',donut:'🍩',croissant:'🥐',juice:'🧃',mojito:'🍹'};
let S=null;
function render(){const ar=S.lang==='ar';document.dir=ar?'rtl':'ltr';$('#title').textContent=S.title;$('#buy').textContent=ar?'شراء':'Buy';
 $('#grid').innerHTML=S.items.map((it,i)=>`<div class="it"><div class="ic">${EMO[it.item]||'🛒'}</div><b>${ar&&it.labelAr?it.labelAr:it.label}</b><div class="p">$${it.price}</div>
 <div class="q"><button data-i="${i}" data-d="-1">−</button><span>${S.cart[it.item]||0}</span><button data-i="${i}" data-d="1">+</button></div></div>`).join('');
 const tot=S.items.reduce((a,it)=>a+(S.cart[it.item]||0)*it.price,0);$('#total').textContent='$'+tot;$('#buy').disabled=!tot;
 document.querySelectorAll('.q button').forEach(b=>b.onclick=()=>{const it=S.items[+b.dataset.i];S.cart[it.item]=Math.max(0,Math.min(S.max,(S.cart[it.item]||0)+ +b.dataset.d));render()});}
function close(){$('#app').classList.add('hidden');S=null}
$('#x').onclick=()=>{post('close');close()};$('#buy').onclick=()=>{post('buy',{id:S.id,cart:S.cart});close()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S){post('close');close()}});
window.addEventListener('message',e=>{const m=e.data;if(m.action==='open'){S={...m,cart:{}};$('#app').classList.remove('hidden');render()}});
if(location.protocol==='file:')window.postMessage({action:'open',id:1,title:'Deli 24H',kind:'deli',lang:'ar',max:10,items:[{item:'water',label:'Water',labelAr:'مويه',price:3},{item:'sandwich',label:'Sandwich',labelAr:'ساندويتش',price:8},{item:'chips',label:'Chips',labelAr:'شيبس',price:4},{item:'cola',label:'Cola',labelAr:'كولا',price:4},{item:'coffee',label:'Coffee',labelAr:'قهوة',price:5},{item:'phone',label:'Phone',labelAr:'جوال',price:450},{item:'lighter',label:'Lighter',labelAr:'ولاعة',price:3}]},'*');
</script></body></html>
