<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="ROX Store"><style>
.dm,.lt,.st,.shine{transform-box:fill-box;transform-origin:center}
.dm{animation:dmIn .9s cubic-bezier(.2,1.3,.3,1) both,glow 3s 1.6s ease-in-out infinite}
.xl{stroke-dasharray:60;stroke-dashoffset:60;animation:xIn .45s .55s cubic-bezier(.6,0,.2,1) forwards}
.shine{animation:shine 4s 1.1s cubic-bezier(.4,0,.2,1) infinite}
.lt{animation:ltIn .55s cubic-bezier(.2,.9,.2,1) both}.l1{animation-delay:.75s}.l2{animation-delay:.87s}.l3{animation-delay:.99s}
.st{animation:stIn .6s 1.35s ease-out both}
@keyframes dmIn{0%{transform:scale(0) rotate(-135deg);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
@keyframes xIn{to{stroke-dashoffset:0}}
@keyframes shine{0%{transform:translateX(0);opacity:0}6%{opacity:.55}22%{transform:translateX(230px);opacity:0}100%{transform:translateX(230px);opacity:0}}
@keyframes ltIn{0%{transform:translateY(46px);opacity:0}100%{transform:none;opacity:1}}
@keyframes stIn{0%{opacity:0;transform:translateX(-14px)}100%{opacity:1;transform:none}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(225,40,28,0))}50%{filter:drop-shadow(0 0 14px rgba(225,40,28,.75))}}
@media (prefers-reduced-motion:reduce){.dm,.lt,.st,.xl,.shine{animation:none}.xl{stroke-dashoffset:0}}
</style><g transform="translate(78 14) scale(1.2)"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6A5C"/><stop offset=".45" stop-color="#E1281C"/><stop offset="1" stop-color="#7A0E08"/></linearGradient><mask id="m"><path d="M60 4 116 60 60 116 4 60Z" fill="#fff"/><path class="xl" d="M41 41 79 79M79 41 41 79" stroke="#000" stroke-width="13" fill="none"/></mask></defs><g class="dm" mask="url(#m)"><path d="M60 4 116 60 60 116 4 60Z" fill="url(#g)"/><path d="M60 4 4 60H60Z" fill="#fff" opacity=".16"/><path d="M60 116 116 60H60Z" fill="#000" opacity=".22"/><path d="M60 15 105 60 60 105 15 60Z" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1.5"/><rect class="shine" x="-60" y="-10" width="34" height="140" fill="#fff" opacity="0" transform="skewX(-20)"/></g></g><g transform="translate(41 176) scale(0.84) skewX(-10)" fill-rule="evenodd"><path class="lt l1" d="M0 0H62L78 16V44L64 56 80 100H56L42 60H22V100H0ZM22 20V40H56V20Z" fill="#F2EEE8"/><path class="lt l2" d="M16 0H64L80 16V84L64 100H16L0 84V16ZM22 22V78H58V22Z" fill="#F2EEE8" transform="translate(92 0)"/><path class="lt l3" d="M0 0H26L40 32 54 0H80L53 50 80 100H54L40 68 26 100H0L27 50Z" fill="#E1281C" transform="translate(184 0)"/></g><g class="st" transform="translate(96 268) scale(1.0)" fill="none" stroke="#A1A1AA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H4Q0 2 0 6T4 10H10Q14 10 14 14T10 18H0" transform="translate(0 0)"/><path d="M0 2H14M7 2V18" transform="translate(24 0)"/><path d="M4 2H10Q14 2 14 6V14Q14 18 10 18H4Q0 18 0 14V6Q0 2 4 2Z" transform="translate(48 0)"/><path d="M0 18V2H10Q14 2 14 6.5T10 11H0M8 11 14 18" transform="translate(72 0)"/><path d="M14 2H0V18H14M0 10H11" transform="translate(96 0)"/></g></svg>
