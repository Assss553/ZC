<!doctype html>
<!-- ROX Store | ROX Wheel (weapons + items) | All rights reserved -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROX Wheel</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--a:#3ee0c5;--a-rgb:62,224,197;--card:clamp(104px,15vh,170px);--cardh:clamp(70px,10vh,112px);--R:clamp(170px,26vh,290px)}
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:Inter,sans-serif;color:#fff;background:transparent}
body.preview{background:#59626b url(demo.jpg) center/cover}
#wheel{position:fixed;inset:0;display:none;place-items:center;background:radial-gradient(circle at 50% 50%,rgba(6,7,9,.55),rgba(6,7,9,.25) 60%,transparent);backdrop-filter:blur(7px) saturate(.8)}
#wheel.on{display:grid;animation:in .16s ease-out}@keyframes in{from{opacity:0;transform:scale(1.04)}}
.stage{position:relative;width:calc(var(--R)*2 + var(--card)*1.3);height:calc(var(--R)*2 + var(--cardh)*1.6)}
.orbit{position:absolute;left:50%;top:50%;width:calc(var(--R)*2);height:calc(var(--R)*2);transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(255,255,255,.08)}
.orbit::after{content:"";position:absolute;inset:-1px;border-radius:50%;background:conic-gradient(from var(--ang,0deg),rgba(var(--a-rgb),.9) 0 22deg,transparent 22deg);
  -webkit-mask:radial-gradient(closest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));mask:radial-gradient(closest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));transition:--ang .15s;opacity:var(--show,0)}
/* tabs */
.tabs{position:absolute;left:50%;top:0;transform:translate(-50%,-10px);display:flex;align-items:center;gap:10px}
.tabs .t{display:flex;background:rgba(14,15,18,.72);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:4px;gap:4px}
.tabs button{border:0;background:none;color:rgba(255,255,255,.55);font:700 15px Rajdhani;letter-spacing:2px;padding:7px 18px;border-radius:9px;cursor:pointer}
.tabs button.on{background:#fff;color:#111;box-shadow:none}
.key{display:inline-grid;place-items:center;min-width:26px;height:24px;padding:0 6px;border-radius:7px;background:#f1f2f4;color:#111;font:800 11px Inter;box-shadow:0 3px 0 #9097a1}
/* cards */
.card{position:absolute;left:50%;top:50%;width:var(--card);height:var(--cardh);overflow:hidden;transform:translate(-50%,-50%) translate(var(--x),var(--y));border-radius:16px;cursor:pointer;
  background:linear-gradient(165deg,rgba(40,43,50,.62),rgba(16,17,20,.7));border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 24px rgba(0,0,0,.35);
  display:grid;place-items:center;transition:transform .18s cubic-bezier(.2,1.4,.4,1),background .15s,border-color .15s,box-shadow .15s}
.card.empty{opacity:.55;cursor:default}
.card img{max-width:62%;max-height:64%;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5));transition:transform .2s}
.card .cat{position:absolute;left:10px;top:8px;font:700 10px Inter;letter-spacing:1.5px;color:rgba(255,255,255,.45);text-transform:uppercase}
.card .cnt{position:absolute;right:10px;bottom:7px;font:800 11px Inter;color:rgba(255,255,255,.85)}
.card .dots{position:absolute;left:0;right:0;bottom:7px;display:flex;justify-content:center;gap:4px}
.card .dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.25)}.card .dots i.on{background:var(--a)}
.card.eq::before{content:"";position:absolute;left:14px;right:14px;top:-1px;height:3px;border-radius:0 0 4px 4px;background:var(--a);box-shadow:0 0 14px var(--a)}
.card.sel{transform:translate(-50%,-50%) translate(var(--x),var(--y)) scale(1.12);background:linear-gradient(165deg,rgba(255,255,255,.96),rgba(225,228,234,.94));border-color:#fff;box-shadow:0 18px 36px rgba(0,0,0,.45),0 0 0 3px #fff}
.card .glow{position:absolute;left:12%;right:12%;bottom:-6%;height:60%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.22),transparent);pointer-events:none}
.card.eq .glow{background:radial-gradient(closest-side,rgba(var(--a-rgb),.75),transparent)}

.card .bar{position:absolute;left:0;right:0;bottom:0;height:24%;border-radius:0 0 15px 15px;background:rgba(10,11,13,.82);display:flex;align-items:center;justify-content:center;gap:9px;font:700 clamp(13px,1.9vh,18px) Rajdhani;letter-spacing:1px}
.card .bar b{color:#fff}.card .bar span{color:rgba(255,255,255,.5)}
.card.hasbar img{max-height:52%;transform:translateY(-12%)}
.card.sel .bar{background:rgba(20,21,24,.92)}
.card.sel .cat{color:rgba(0,0,0,.45)}
.card .bar.tg{font-size:clamp(14px,2vh,19px);letter-spacing:2px}
.card .bar.tg.on b{color:var(--a)}
.card .chk{position:absolute;right:8px;bottom:7px;width:22px;height:22px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font:900 13px Inter}
.stats{position:fixed;right:3vw;bottom:6vh;width:clamp(260px,24vw,380px);padding:18px 20px;border-radius:4px;background:rgba(27,27,41,.9);border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(10px);opacity:0;transform:translateX(16px);transition:.2s;pointer-events:none}
.stats.on{opacity:1;transform:none}
.stats h4{font:700 clamp(20px,2.7vh,27px)/1 Rajdhani;letter-spacing:1px;text-transform:uppercase}
.stats h5{font:700 clamp(14px,1.9vh,18px) Rajdhani;letter-spacing:2px;color:rgba(255,255,255,.55);text-transform:uppercase;margin:3px 0 14px}
.stats .r{margin-top:10px}.stats .r div{display:flex;justify-content:space-between;font:700 clamp(13px,1.8vh,17px) Rajdhani;letter-spacing:2px}
.stats .r div span{color:rgba(255,255,255,.6)}
.stats .r i{display:block;height:5px;margin-top:5px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}
.stats .r i b{display:block;height:100%;border-radius:5px;background:#fff}
.stats .mods{margin-top:14px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;font:700 clamp(13px,1.8vh,17px) Rajdhani;letter-spacing:2px}
.stats .mods span{color:rgba(255,255,255,.6)}
.eqtoast{position:fixed;left:50%;bottom:16vh;transform:translate(-50%,10px);display:flex;align-items:center;gap:12px;opacity:0;transition:.25s;pointer-events:none;
  font:700 clamp(18px,2.6vh,26px) Rajdhani;letter-spacing:1.5px;text-transform:uppercase;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.eqtoast.on{opacity:1;transform:translate(-50%,0)}
.eqtoast .key{font-size:12px}.card.sel .cnt{color:#111}.card.sel img{transform:scale(1.08)}
.cyc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) translate(var(--x),var(--y));display:none;align-items:center;gap:calc(var(--card)*1.12 + 26px);pointer-events:none;z-index:2}
.cyc.on{display:flex}
.pager{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) translate(var(--x),calc(var(--y) + var(--cardh)*.82));font:700 16px Rajdhani;letter-spacing:2px;display:none}
.pager.on{display:block}
/* center */
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:calc(var(--R)*1.1)}
.center .nm{font:700 clamp(22px,3.4vh,34px) Rajdhani;letter-spacing:1.5px;color:var(--a);text-transform:uppercase;text-shadow:0 0 22px rgba(var(--a-rgb),.45)}
.center .ct{font:700 clamp(13px,1.8vh,17px) Rajdhani;letter-spacing:3px;color:rgba(255,255,255,.65);text-transform:uppercase;margin-top:2px}
.center .meta{margin-top:10px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.center .meta span{font:700 11px Inter;padding:4px 10px;border-radius:20px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);color:#d6d9df}
.center .ammo{font:700 clamp(18px,2.6vh,26px) Rajdhani;margin-top:8px}.center .ammo small{color:rgba(255,255,255,.5);font-size:.7em}
.foot{position:absolute;left:50%;bottom:0;transform:translate(-50%,14px);display:flex;gap:16px;font:600 12px Inter;color:rgba(255,255,255,.7);white-space:nowrap}
.foot span{display:flex;align-items:center;gap:7px}

/* ===== next-gen look (matches reference) ===== */
:root{--card:clamp(110px,12vw,190px);--cardh:clamp(70px,7.6vw,120px);--R:clamp(230px,33vh,350px)}
.card.hasbar .dots{display:none}
#wheel{background:rgba(10,12,18,.35);backdrop-filter:blur(10px) saturate(.85) brightness(.75)}
.orbit{border:1px solid rgba(255,255,255,.12)}.orbit::after{display:none}
.card{border-radius:1px;background:linear-gradient(180deg,rgba(120,124,132,.32),rgba(70,74,82,.32));border:1px solid rgba(255,255,255,.05);box-shadow:none}
.card.empty{opacity:1;background:rgba(60,64,72,.22)}
.card .cat{display:none}
.card .glow{left:0;right:0;bottom:20%;height:34%;border-radius:0;background:radial-gradient(60% 100% at 50% 100%,rgba(62,224,197,.75),transparent 70%)}
.card:not(.hasbar) .glow{bottom:0}
.card.eq .glow{background:radial-gradient(60% 100% at 50% 0%,rgba(255,110,170,.7),transparent 70%);top:0;bottom:auto}
.card.eq::before{display:none}
.card .bar{border-radius:0;height:22%;background:rgba(30,32,38,.85);font:700 clamp(15px,2.1vh,22px) Rajdhani}
.card .bar span{color:rgba(255,255,255,.55)}
.card.sel{transform:translate(-50%,-50%) translate(var(--x),var(--y));background:linear-gradient(180deg,rgba(235,236,238,.95),rgba(150,152,158,.92));border:3px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.card.sel .bar{background:rgba(70,72,78,.9)}.card.sel .bar b,.card.sel .bar span{color:#fff}
.card img{max-width:58%;max-height:54%}
.center .nm{color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);font-size:clamp(24px,3.4vh,36px)}
.center .ct{color:rgba(255,255,255,.7);font-size:clamp(15px,2.1vh,21px)}
.center .ammo,.center .meta{display:none}
.tabs{flex-direction:column;gap:8px;transform:translate(-50%,-34px)}
.tabs .key{order:-1}.tabs .key+.t+.key{display:none}
.tabs .t{border:0;border-radius:0;background:rgba(30,32,40,.85);padding:0;gap:0}
.tabs button{border-radius:0;font:700 clamp(16px,2.2vh,22px) Rajdhani;letter-spacing:1px;padding:6px 16px;color:#fff}
.tabs button.on{background:#fff;color:#111;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.tabs button:last-child.on{clip-path:polygon(10px 0,100% 0,100% 100%,0 100%)}
.stats{border-radius:0;background:rgba(38,40,50,.88);padding:0;width:clamp(280px,25vw,420px)}
.stats h4,.stats h5{padding:0 18px}.stats h4{padding-top:14px}.stats h5{margin-bottom:6px}
.stats .r{padding:8px 18px}.stats .r div{font-size:clamp(16px,2.2vh,22px)}
.stats .r i{height:5px;border-radius:0;background:rgba(255,255,255,.15)}.stats .r i b{border-radius:0;background:#fff}
.stats .mods{margin:6px 0 0;padding:12px 18px;border-top:0;background:rgba(255,255,255,.04);font-size:clamp(16px,2.2vh,22px)}
.wtop{position:fixed;right:2vw;top:1.6vh;font:700 clamp(22px,3.2vh,34px) Rajdhani;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);display:none;align-items:center;gap:10px}
#wheel.on~.wtop{display:flex}
.wtop i{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center}
.wtop i::after{content:"";width:14px;height:9px;border-radius:2px;background:#3ddc84}
.sw3d{cursor:pointer;pointer-events:auto}.foot{pointer-events:auto}
</style></head><body>
<div id="wheel"><div class="stage" id="stage">
  <div class="orbit" id="orbit"></div>
  <div class="tabs"><span class="key">Q</span><div class="t"><button data-t="weapons" class="on">WEAPONS</button><button data-t="items">ITEMS</button></div><span class="key">E</span></div>
  <div id="cards"></div>
  <div class="cyc" id="cyc"><span class="key">◀</span><span class="key">▶</span></div>
  <div class="pager" id="pager"></div>
  <div class="center"><div class="nm" id="nm">—</div><div class="ct" id="ct"></div><div class="ammo" id="ammo"></div><div class="meta" id="meta"></div></div>
  <div class="foot"><span><span class="key">MOUSE</span>Select</span><span><span class="key">WHEEL</span>Cycle</span><span><span class="key">Q</span><span class="key">E</span>Tab</span><span><span class="key">TAB</span>Release to equip</span><span class="sw3d" id="sw3d"><span class="key">C</span>3D Inventory</span></div>
</div></div>
<div class="stats" id="stats"></div>
<div class="wtop" id="wtop"></div>
<div class="eqtoast" id="eqt"><span class="key" id="eqk">TAB</span><span id="eql"></span></div>
<script>
const RES=typeof GetParentResourceName==='function'?GetParentResourceName():null;
const post=(n,d={})=>RES?fetch(`https://${RES}/${n}`,{method:'POST',body:JSON.stringify(d)}).then(r=>r.json()).catch(()=>({})):Promise.resolve({});
const CATS={weapons:['Melee','Pistols','SMG','Shotguns','Rifles','Snipers','Heavy','Throwables'],items:['Food','Drinks','Medical','Armour','Equipment','Tools','Gear','Ammo']};
// state: { tab, data:{weapons:[[...items]x8], items:[...]}, idx:{weapons:[0..], items:[..]}, sel }
const S={tab:'weapons',data:{weapons:[],items:[]},idx:{weapons:Array(8).fill(0),items:Array(8).fill(0)},sel:-1,equipped:null,img:'nui://ox_inventory/web/images/'};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--R'))||getComputedStyle(document.documentElement).getPropertyValue('--R');
function pos(i){const st=$('orbit').getBoundingClientRect(),r=st.width/2,a=-Math.PI/2+i*Math.PI/4;return[Math.cos(a)*r,Math.sin(a)*r*.92]}
const img=it=>it.image?(it.image.indexOf('gear/')===0&&RES?it.image:it.image):(S.img+it.name+'.png');
function render(){
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
 const L=S.data[S.tab];let h='';
 for(let i=0;i<8;i++){const list=L[i]||[],k=S.idx[S.tab][i]%Math.max(1,list.length),it=list[k],[x,y]=pos(i);
  const bar=it&&it.ammo!=null;const tgl=it&&it.toggle;
  h+=`<div class="card ${it?'':'empty'} ${i===S.sel?'sel':''} ${it&&S.equipped===it.name?'eq':''} ${bar||tgl?'hasbar':''}" data-i="${i}" style="--x:${x}px;--y:${y}px">
   ${it?'<div class="glow"></div>':''}<span class="cat">${CATS[S.tab][i]}</span>${it?`<img src="${img(it)}" onerror="this.style.display='none'">`:''}
   ${bar?`<div class="bar"><b>${it.ammo}</b><span>${it.ammoTotal??0}</span></div>`:''}${it&&it.toggle?`<div class="bar tg ${it.on?'on':''}"><b>${it.on?'ON':'OFF'}</b></div>`:''}${it&&it.active?'<span class="chk">✓</span>':''}
   ${it&&it.count>1?`<span class="cnt">x${it.count.toLocaleString('en-US')}</span>`:''}
   ${list.length>1&&i!==S.sel?`<div class="dots">${list.map((_,j)=>`<i class="${j===k?'on':''}"></i>`).join('')}</div>`:''}</div>`}
 $('cards').innerHTML=h;info()}
function info(){const i=S.sel,list=i>=0?(S.data[S.tab][i]||[]):[],k=i>=0?S.idx[S.tab][i]%Math.max(1,list.length):0,it=list[k];
 const o=$('orbit');o.style.setProperty('--show',i>=0?1:0);o.style.setProperty('--ang',(i*45-11)+'deg');
 $('nm').textContent=it?it.label:(i>=0?'Empty':'—');$('ct').textContent=i>=0?(it&&it.stats&&it.stats.type?it.stats.type:CATS[S.tab][i]):(S.tab==='weapons'?'Weapons':'Items');
 $('ammo').innerHTML=it&&it.ammo!=null?`${it.ammo} <small>/ ${it.ammoTotal??0}</small>`:'';
 $('meta').innerHTML=it?[it.durability!=null?`${Math.round(it.durability)}% condition`:'',it.weight?`${(it.weight/1000).toFixed(2)} kg`:'',it.count>1?`x${it.count}`:''].filter(Boolean).map(t=>`<span>${t}</span>`).join(''):'';
 const st=$('stats');
 if(it&&it.stats){const R=(k,v)=>`<div class="r"><div>${k}<span>${Math.round(v)}</span></div><i><b style="width:${Math.max(3,Math.min(100,v))}%"></b></i></div>`;
  st.innerHTML=`<h4>${esc(it.label)}</h4><h5>${esc(it.stats.type||CATS[S.tab][i])}</h5>${R('DAMAGE',it.stats.damage)}${R('ACCURACY',it.stats.accuracy)}${R('HANDLING',it.stats.handling)}${R('RANGE',it.stats.range)}<div class="mods">MODS<span>${it.stats.mods||0} / ${it.stats.maxMods??4}</span></div>`;st.classList.add('on')}
 else st.classList.remove('on');
 const cy=$('cyc'),pg=$('pager');
 if(i>=0&&list.length>1){const[x,y]=pos(i);[cy,pg].forEach(e=>{e.style.setProperty('--x',x+'px');e.style.setProperty('--y',y+'px');e.classList.add('on')});pg.textContent=`${k+1} / ${list.length}`}
 else{cy.classList.remove('on');pg.classList.remove('on')}}
function hover(i){if(i===S.sel)return;S.sel=i;render();if(i>=0)post('hover',{})}
function pick(e){const st=$('stage').getBoundingClientRect(),cx=st.left+st.width/2,cy=st.top+st.height/2,dx=e.clientX-cx,dy=e.clientY-cy;
 if(Math.hypot(dx,dy)<$('orbit').getBoundingClientRect().width*.22)return -1;let a=Math.atan2(dy,dx)+Math.PI/2+Math.PI/8;a=(a%(2*Math.PI)+2*Math.PI)%(2*Math.PI);return Math.floor(a/(Math.PI/4))%8}
function cycle(d){const i=S.sel;if(i<0)return;const n=(S.data[S.tab][i]||[]).length;if(n<2)return;S.idx[S.tab][i]=(S.idx[S.tab][i]+d+n)%n;render()}
function tab(t){S.tab=t||(S.tab==='weapons'?'items':'weapons');S.sel=-1;render()}
function current(){const i=S.sel;if(i<0)return null;const list=S.data[S.tab][i]||[];return list[S.idx[S.tab][i]%Math.max(1,list.length)]||null}
function open(d){if(d.cash!=null)document.getElementById('wtop').innerHTML='$'+Math.round(d.cash).toLocaleString('en-US')+'<i></i>';S.data=d.data||S.data;if(d.imagepath)S.img=d.imagepath.replace(/\/?$/,'/');S.equipped=d.equipped||null;if(d.tab)S.tab=d.tab;S.sel=-1;$('wheel').classList.add('on');render()}
function close(confirm){if(!$('wheel').classList.contains('on'))return;const it=confirm?current():null;$('wheel').classList.remove('on');post('close',{slot:it?it.slot:null,tab:S.tab})}
document.addEventListener('mousemove',e=>{if($('wheel').classList.contains('on'))hover(pick(e))});
document.addEventListener('wheel',e=>{if($('wheel').classList.contains('on'))cycle(e.deltaY>0?1:-1)});
document.addEventListener('click',e=>{if(!$('wheel').classList.contains('on'))return;if(e.target.closest('#sw3d')){$('wheel').classList.remove('on');post('switch');return}const b=e.target.closest('.tabs button');if(b)return tab(b.dataset.t);if(S.sel>=0)close(true)});
document.addEventListener('contextmenu',e=>{e.preventDefault();if($('wheel').classList.contains('on'))tab()});
document.addEventListener('keydown',e=>{if(!$('wheel').classList.contains('on'))return;const k=e.key.toLowerCase();
 if(k==='c'){$('wheel').classList.remove('on');post('switch');return}if(k==='q'||k==='e')tab();else if(k==='arrowleft'||k==='a')cycle(-1);else if(k==='arrowright'||k==='d')cycle(1);else if(k==='escape')close(false)});
document.addEventListener('keyup',e=>{if(e.key==='Tab'&&$('wheel').classList.contains('on'))close(true)});
window.addEventListener('message',e=>{const d=e.data||{};if(d.action==='open')open(d);if(d.action==='close')close(!!d.confirm);if(d.action==='cycle')cycle(d.dir);if(d.action==='tab')tab();if(d.action==='equipToast'){$('eql').textContent=d.label||'';$('eqk').textContent=d.key||'TAB';const t=$('eqt');t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}});
addEventListener('resize',()=>{if($('wheel').classList.contains('on'))render()});
/* browser preview */
