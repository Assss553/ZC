<!DOCTYPE html>
<!-- ROX Store | rox_notify | All rights reserved. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fa/css/fontawesome.min.css"><link rel="stylesheet" href="fa/css/solid.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Cairo:wght@600;700&display=swap" rel="stylesheet">
<style>
:root { --c: #ff5a1f; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: transparent; overflow: hidden; font-family: 'Inter', 'Cairo', sans-serif; }
body.preview { background: url(../../rox_police/html/img/wallpapers/street.jpg) center/cover; height: 100vh; }
#list { position: fixed; top: 32px; right: 28px; width: 380px; display: flex; flex-direction: column; gap: 10px; }
.n { position: relative; display: flex; min-height: 66px; border-radius: 6px; overflow: hidden; background: rgba(236,237,242,.9); backdrop-filter: blur(8px);
  box-shadow: 0 10px 30px rgba(0,0,0,.35); animation: inN .5s cubic-bezier(.2,1.1,.3,1) both; transform-origin: right center; }
.n::before { content: ''; position: absolute; inset: 0 0 0 40%; background: repeating-linear-gradient(-45deg, rgba(0,0,0,.05) 0 1px, transparent 1px 9px);
  -webkit-mask: linear-gradient(90deg, transparent, #000 60%); mask: linear-gradient(90deg, transparent, #000 60%); pointer-events: none; }
.n.out { animation: outN .45s cubic-bezier(.6,0,.8,.4) forwards; }
.ic { width: 56px; flex: none; display: grid; place-items: center; background: #1b1b1f; color: var(--c); font-size: 20px; position: relative; }
.ic::after { content: ''; position: absolute; right: -6px; top: 50%; border: 6px solid transparent; border-left-color: #1b1b1f; border-right: 0; transform: translateY(-50%); }
.ic i { filter: drop-shadow(0 0 6px var(--c)); animation: ring 1s ease .3s; }
.bd { padding: 11px 16px 13px 22px; position: relative; flex: 1; min-width: 0; }
.bd b { display: block; color: var(--c); font-size: 15px; font-weight: 800; margin-bottom: 3px; }
.bd p { color: #1a1a1d; font-size: 12.5px; font-weight: 600; line-height: 1.45; word-wrap: break-word; }
.pg { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--c); animation: pg linear forwards; }
[dir=rtl] p, [dir=rtl] b { text-align: right; }
.success { --c: #1fb86a; } .error { --c: #ff3b4e; } .warning { --c: #f29a00; }
@keyframes inN { from { opacity: 0; transform: translateX(120%) skewX(-8deg); filter: blur(4px); } 60% { transform: translateX(-4%); } to { opacity: 1; transform: none; filter: none; } }
@keyframes outN { to { opacity: 0; transform: translateX(120%) skewX(8deg); filter: blur(4px); margin-top: -76px; } }
@keyframes pg { from { width: 100%; } to { width: 0; } }
@keyframes ring { 0%,100% { transform: rotate(0); } 20% { transform: rotate(18deg); } 40% { transform: rotate(-14deg); } 60% { transform: rotate(8deg); } 80% { transform: rotate(-4deg); } }
</style></head><body><div id="list"></div>
<script>
const ICONS = { inform: 'bell', success: 'circle-check', error: 'circle-xmark', warning: 'triangle-exclamation' };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clean = (s) => esc(s).replace(/~[a-zA-Z]~/g, '').replace(/\n/g, '<br>');
function push(d) {
  const L = document.getElementById('list'); if (L.children.length >= 5) L.firstElementChild.remove();
  const el = document.createElement('div'), ms = Math.max(1500, +d.duration || 5000), rtl = /[؀-ۿ]/.test((d.title || '') + (d.text || ''));
  el.className = 'n ' + (d.type || 'inform'); if (rtl) el.dir = 'rtl';
  el.innerHTML = `<div class="ic"><i class="fa-solid fa-${esc(d.icon || ICONS[d.type] || 'bell')}"></i></div><div class="bd">${d.title ? `<b>${clean(d.title)}</b>` : ''}<p>${clean(d.text)}</p></div><div class="pg" style="animation-duration:${ms}ms"></div>`;
  L.appendChild(el);
  setTimeout(() => { el.classList.add('out'); el.addEventListener('animationend', () => el.remove(), { once: true }); }, ms);
}
window.addEventListener('message', (e) => e.data && e.data.text !== undefined && push(e.data));
if (!window.invokeNative) { document.body.classList.add('preview');
  push({ title: 'Long message', text: 'A notification with a much longer message, so you can see the lines in the background on the right side of the box.', duration: 60000 });
  push({ title: 'تم', text: 'تم سحب $1,000 من حسابك البنكي', type: 'success', duration: 60000 });
  push({ title: 'Error', text: 'Not enough money', type: 'error', duration: 60000 }); push({ title: 'Warning', text: 'Low fuel', type: 'warning', duration: 60000 }); }
</script></body></html>
