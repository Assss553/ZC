<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stand Up Prompt</title>
<style>
  :root { --panel: rgba(18,18,20,.82); --key: rgba(255,255,255,.12); --text: #ececec; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  .scene {
    position: fixed; inset: 0;
    background: url("scene.jpg") center/cover no-repeat;
    filter: brightness(.9);
  }
  .vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.65) 100%); }

  .prompt {
    position: fixed; left: 60%; top: 55%; transform: translate(-50%, -50%);
    display: flex; align-items: center; gap: 14px;
    padding: 10px 18px 10px 10px;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    backdrop-filter: blur(6px);
    box-shadow: 0 6px 24px rgba(0,0,0,.55);
    color: var(--text); cursor: pointer; user-select: none;
    animation: fadeIn .35s ease-out;
    transition: transform .12s, opacity .25s;
  }
  .prompt.pressed { transform: translate(-50%, -50%) scale(.94); }
  .prompt.hidden { opacity: 0; pointer-events: none; }
  .key {
    width: 34px; height: 34px; display: grid; place-items: center;
    background: var(--key); border: 1px solid rgba(255,255,255,.18);
    border-radius: 7px; font-weight: 700; font-size: 16px;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.4);
  }
  .label { font-size: 18px; font-weight: 500; letter-spacing: .3px; text-shadow: 0 1px 2px #000; }
  @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -40%); } }
  @media (max-width: 480px) { .prompt { left: 50%; } .label { font-size: 16px; } }
</style>
</head>
<body>
  <div class="scene"></div>
  <div class="vignette"></div>

  <div class="prompt" id="prompt" role="button" aria-label="Stand Up (X)">
    <span class="key">X</span>
    <span class="label">Stand Up</span>
  </div>

<script>
  const p = document.getElementById('prompt');
  function trigger() {
    p.classList.add('pressed');
    setTimeout(() => { p.classList.remove('pressed'); p.classList.add('hidden'); }, 140);
    setTimeout(() => p.classList.remove('hidden'), 2000); // يرجع للعرض
  }
  p.addEventListener('click', trigger);
  addEventListener('keydown', e => { if (e.key.toLowerCase() === 'x') trigger(); });
</script>
</body>
</html>
