<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>VC2 Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--o:#e4501c;--o2:#ff7a3d;--mu:#8a8a92}
html,body{width:1280px;height:724px;overflow:hidden;background:#07080a;font-family:"Nunito",sans-serif;color:#f2f2f4}
.a{position:absolute}
.bg{inset:0;background:radial-gradient(900px 420px at 30% 60%,#e4501c26,transparent 70%),radial-gradient(700px 400px at 90% 10%,#3a5aff14,transparent 70%),#08090c}
.grid{inset:0;background:linear-gradient(#ffffff07 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,#ffffff07 1px,transparent 1px) 0 0/40px 40px;mask-image:radial-gradient(ellipse at center,#000 40%,transparent 85%)}
.frame{inset:10px;border:3px solid #e4501caa;border-radius:22px;box-shadow:inset 0 0 50px #e4501c40,0 0 30px #e4501c55}
.cn{width:46px;height:46px;border:6px solid var(--o2);filter:drop-shadow(0 0 8px var(--o))}
.cn.tl{left:10px;top:10px;border-right:0;border-bottom:0;border-radius:22px 0 0 0}.cn.tr{right:10px;top:10px;border-left:0;border-bottom:0;border-radius:0 22px 0 0}
.cn.bl{left:10px;bottom:10px;border-right:0;border-top:0;border-radius:0 0 0 22px}.cn.br{right:10px;bottom:10px;border-left:0;border-top:0;border-radius:0 0 22px 0}
/* top bar */
.top{left:44px;right:44px;top:34px;height:60px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:52px;font-weight:900;letter-spacing:.02em;text-shadow:0 0 24px #ff6a2b88}.logo i{font-style:normal;color:var(--o)}
.logo small{font-size:16px;letter-spacing:.38em;color:var(--mu);margin-left:16px;vertical-align:middle}
.st{display:flex;align-items:center;gap:22px;font-size:20px;font-weight:900;letter-spacing:.16em;color:var(--mu)}
.on{color:#83e03a}.on::before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;background:#83e03a;margin-right:9px;box-shadow:0 0 10px #83e03a;animation:bl 1.2s steps(2) infinite}
#clock{font-size:30px;color:#f2f2f4;letter-spacing:.06em}
@keyframes bl{50%{opacity:.2}}
.sep{left:44px;right:44px;top:104px;height:2px;background:linear-gradient(90deg,transparent,var(--o),transparent);opacity:.7}
/* featured car */
.feat{left:44px;top:126px;width:780px;height:470px;border-radius:16px;background:linear-gradient(160deg,#16171c,#0d0e11);border:2px solid #26272d;overflow:hidden}
.feat .tag{left:26px;top:22px;padding:6px 14px;border-radius:6px;background:#3d1f1d;border:1px solid #6b2e1c;color:var(--o2);font-size:16px;font-weight:900;letter-spacing:.2em}
.feat .idx{right:26px;top:24px;font-size:18px;font-weight:900;color:var(--mu);letter-spacing:.12em}
.stage{left:0;right:0;top:70px;height:250px;display:flex;align-items:center;justify-content:center}
.stage .glow{left:120px;right:120px;top:150px;height:70px;border-radius:50%;background:radial-gradient(ellipse,#e4501c66,transparent 70%);filter:blur(8px)}
.stage img{position:relative;max-width:560px;max-height:240px;object-fit:contain;filter:drop-shadow(0 20px 18px #000c)}
.stage svg{position:relative;width:360px;height:180px;fill:none;stroke:var(--o2);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 14px var(--o))}
.info{left:30px;right:30px;bottom:26px;display:flex;align-items:flex-end;justify-content:space-between}
.info h2{font-size:54px;font-weight:900;line-height:1;text-transform:uppercase;max-width:470px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .br{font-size:22px;font-weight:800;color:#b9b9c0;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.info .pr{text-align:right}
.info .pr b{display:block;font-size:52px;font-weight:900;color:var(--o2);line-height:1;text-shadow:0 0 20px #ff6a2b66}
.info .pr span{font-size:18px;font-weight:800;color:var(--mu);letter-spacing:.14em}
.prog{left:0;bottom:0;height:5px;background:var(--o);box-shadow:0 0 12px var(--o)}
.prog.run{animation:prog 4.5s linear}@keyframes prog{from{width:0}to{width:100%}}
.slide{animation:sl .7s cubic-bezier(.2,.9,.3,1.1)}@keyframes sl{from{opacity:0;transform:translateX(60px)}}
/* services */
.svc{left:848px;top:126px;width:388px;height:470px;display:flex;flex-direction:column;gap:14px}
.sv{flex:1;border-radius:14px;background:#121317;border:2px solid #25262c;display:flex;align-items:center;gap:20px;padding:0 22px;position:relative;overflow:hidden}
.sv::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#e4501c22,transparent);transform:translateX(-100%);animation:sweep 6s infinite;animation-delay:calc(var(--i)*1.5s)}
@keyframes sweep{0%,20%{transform:translateX(-100%)}40%,100%{transform:translateX(100%)}}
.sv .ic{flex:0 0 64px;height:64px;border-radius:12px;background:#3c1a11;display:grid;place-items:center}
.sv svg{width:34px;height:34px;fill:none;stroke:var(--o2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sv b{display:block;font-size:26px;font-weight:900;letter-spacing:.04em}
.sv span{font-size:16px;font-weight:800;color:var(--mu)}
/* ticker */
.tick{left:44px;right:44px;bottom:36px;height:58px;border-radius:12px;background:#e4501c;overflow:hidden;display:flex;align-items:center;box-shadow:0 0 30px #e4501c66}
.tick .lb{flex:none;height:100%;padding:0 22px;display:flex;align-items:center;background:#111;color:var(--o2);font-size:20px;font-weight:900;letter-spacing:.2em;z-index:1}
.tick .tr{white-space:nowrap;font-size:24px;font-weight:900;letter-spacing:.06em;color:#fff;padding-left:30px;animation:tk 28s linear infinite}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.scan{left:0;right:0;height:3px;top:0;background:#ff8a5044;box-shadow:0 0 20px #ff8a50;animation:scan 5s linear infinite;opacity:.6}
@keyframes scan{to{top:724px}}
.lines{inset:0;background:repeating-linear-gradient(transparent 0 3px,#00000022 3px 4px);pointer-events:none}
</style></head><body>
<div class="a bg"></div><div class="a grid"></div>
<div class="a top"><div class="logo">VC<i>2</i><small>AUTO SHOWROOM</small></div><div class="st"><span class="on">ONLINE</span><span id="clock">00:00</span></div></div>
<div class="a sep"></div>

<div class="a feat">
 <div class="a tag">FEATURED</div><div class="a idx" id="idx">01 / 06</div>
 <div class="a stage" id="stage"><div class="a glow"></div></div>
 <div class="a info" id="info"></div>
 <div class="a prog" id="prog"></div>
</div>

<div class="a svc">
 <div class="sv" style="--i:0"><div class="ic"><svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg></div><div><b>BUY</b><span>Pay by bank or cash</span></div></div>
 <div class="sv" style="--i:1"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><path d="M12 14v7M10 12H3M14 12h7"/></svg></div><div><b>TEST DRIVE</b><span>Try it before you buy</span></div></div>
 <div class="sv" style="--i:2" id="svOrder"><div class="ic"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/></svg></div><div><b>CUSTOM ORDER</b><span>Your dream car, built</span></div></div>
 <div class="sv" style="--i:3"><div class="ic"><svg viewBox="0 0 24 24"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg></div><div><b>MY CARS</b><span>Get any of your cars back</span></div></div>
</div>

<div class="a tick"><div class="lb">NEW IN</div><div class="tr" id="tick"></div></div>
<div class="a scan"></div><div class="a lines"></div>
<div class="a frame"></div><div class="a cn tl"></div><div class="a cn tr"></div><div class="a cn bl"></div><div class="a cn br"></div>
<script>
const $ = i => document.getElementById(i);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CAR = '<svg viewBox="0 0 24 24"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>';
let F = { cars: [], currency: '$', imageUrl: '' }, i = 0, timer = null;
const fmt = n => F.currency + Number(n || 0).toLocaleString('en-US');
function pic(c) {
  const src = c.image || (F.imageUrl ? F.imageUrl.replace('%s', c.model) : '');
  return src ? `<img src="${esc(src)}" onerror="this.outerHTML=window.CAR">` : CAR;
}
window.CAR = CAR;
function show() {
  if (!F.cars.length) return;
  const c = F.cars[i % F.cars.length];
  $('stage').innerHTML = '<div class="a glow"></div>' + pic(c);
  $('info').innerHTML = `<div><div class="br">${esc(c.brand || '')}</div><h2>${esc(c.label)}</h2></div>
    <div class="pr"><b>${fmt(c.price)}</b><span>${c.speed ? c.speed + ' KM/H' : 'AVAILABLE NOW'}</span></div>`;
  $('idx').textContent = `${String(i % F.cars.length + 1).padStart(2, '0')} / ${String(F.cars.length).padStart(2, '0')}`;
  for (const el of [$('stage'), $('info')]) { el.classList.remove('slide'); void el.offsetWidth; el.classList.add('slide'); }
  const p = $('prog'); p.classList.remove('run'); void p.offsetWidth; p.classList.add('run');
  i++;
}
function feed(d) {
  F = Object.assign(F, d);
  $('svOrder').style.display = d.orders === false ? 'none' : '';
  const t = F.cars.map(c => `${(c.brand ? c.brand + ' ' : '') + c.label}  ·  ${fmt(c.price)}`).join('     ◆     ');
  $('tick').textContent = t + '     ◆     ' + t + '     ◆     ';
  i = 0; show(); clearInterval(timer); timer = setInterval(show, 4500);
}
function clock() { const d = new Date(); $('clock').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
clock(); setInterval(clock, 10000);
addEventListener('message', e => { let d = e.data; if (typeof d === 'string') { try { d = JSON.parse(d); } catch (x) { return; } } if (d && d.type === 'feed') feed(d); });
// preview data until the game sends the real catalogue
feed({ currency: '$', imageUrl: '', cars: [
  { model: 'adder', label: 'Adder', brand: 'Truffade', price: 1000000, speed: 198 },
  { model: 't20', label: 'T20', brand: 'Progen', price: 850000, speed: 198 },
  { model: 'zentorno', label: 'Zentorno', brand: 'Pegassi', price: 725000, speed: 197 },
  { model: 'comet2', label: 'Comet', brand: 'Pfister', price: 175000, speed: 183 },
  { model: 'elegy2', label: 'Elegy RH8', brand: 'Annis', price: 150000, speed: 184 },
  { model: 'dubsta2', label: 'Dubsta', brand: 'Benefactor', price: 110000, speed: 160 }
] });
</script>
</body></html>
