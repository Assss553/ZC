<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interaction Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #e8661c;
    --orange-light: #f08a4b;
    --orange-dark: rgba(150, 62, 18, 0.88);
    --grey-fill: rgba(70, 64, 58, 0.55);
    --grey-line: rgba(225, 225, 225, 0.85);
    --scale: 1.4;            /* overall size of the menu */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;   /* transparent in game (NUI) */
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    user-select: none;
    overflow: hidden;
    min-height: 100vh;
  }
  body.preview { background: radial-gradient(circle at 50% 45%, #5a4a3c, #1d1a17 75%); }

  .menu {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%) scale(var(--scale));
    display: flex;
    align-items: flex-start;
  }
  .menu.hidden { display: none; }

  /* ---- E key ---- */
  .key {
    width: 34px;
    height: 30px;
    margin-top: -3px;
    margin-right: 10px;
    background: rgba(140, 58, 18, 0.9);
    border: 1.5px solid var(--orange-light);
    color: #fff;
    font-size: 20px;
    line-height: 26px;
    text-align: center;
    box-shadow: 0 0 4px rgba(0, 0, 0, .5);
  }

  /* ---- options ---- */
  .options { display: flex; flex-direction: column; gap: 6px; }
  .option {
    display: flex;
    align-items: center;
    height: 26px;
    cursor: pointer;
  }

  .radio {
    width: 13px;
    height: 13px;
    margin-right: 18px;
    border-radius: 50%;
    border: 1.5px solid rgba(215, 215, 215, .9);
    background: rgba(40, 40, 40, .6);
    flex-shrink: 0;
  }
  .option.active .radio {
    border-color: #f5a070;
    background: var(--orange);
    box-shadow: 0 0 5px rgba(232, 102, 28, .8);
  }

  .label {
    position: relative;
    width: 200px;
    height: 26px;
    color: #fff;
    font-size: 14px;
    line-height: 26px;
    text-align: center;
    letter-spacing: .2px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .7);
  }
  /* skewed parallelogram behind the text */
  .label::before {
    content: "";
    position: absolute;
    inset: 0;
    transform: skewX(-22deg);
    background: var(--grey-fill);
    border: 1px solid var(--grey-line);
    border-top-width: 2.5px;
    z-index: -1;
  }
  .label span { position: relative; z-index: 1; }

  .option.active .label::before {
    background: linear-gradient(90deg, rgba(120, 50, 15, .55), var(--orange-dark) 40%, rgba(150, 62, 18, .75));
    border-color: var(--orange);
    border-top-width: 3px;
  }
  /* orange top line extends a little past the shape on the active item */
  .option.active .label::after {
    content: "";
    position: absolute;
    top: 0;
    left: 2px;
    right: -6px;
    height: 3px;
    background: var(--orange);
  }
</style>
</head>
<body class="preview">

<div class="menu" id="menu">
  <div class="key" id="key">E</div>
  <div class="options" id="options"></div>
</div>

<script>
  let items = [
    { label: "Browse IAA Vehicles",          action: "browse_vehicles" },
    { label: "Return Nearby IAA Vehicle",    action: "return_vehicle" },
    { label: "Retrieve IAA Helicopter",      action: "retrieve_heli" },
    { label: "Return Nearby IAA Helicopter", action: "return_heli" }
  ];
  let index = 0;
  const menu = document.getElementById('menu');
  const list = document.getElementById('options');

  function render() {
    list.innerHTML = '';
    items.forEach((it, i) => {
      const el = document.createElement('div');
      el.className = 'option' + (i === index ? ' active' : '');
      el.innerHTML = `<div class="radio"></div><div class="label"><span></span></div>`;
      el.querySelector('span').textContent = it.label;
      el.onmouseenter = () => { index = i; render(); };
      el.onclick = () => { index = i; select(); };
      list.appendChild(el);
    });
  }

  function select() {
    const it = items[index];
    console.log('Selected:', it.action);
    // FiveM NUI callback (ignored outside the game)
    if (typeof GetParentResourceName === 'function') {
      fetch(`https://${GetParentResourceName()}/select`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(it)
      });
    }
  }

  document.addEventListener('keydown', e => {
    if (menu.classList.contains('hidden')) return;
    if (e.key === 'ArrowDown') { index = (index + 1) % items.length; render(); }
    if (e.key === 'ArrowUp')   { index = (index - 1 + items.length) % items.length; render(); }
    if (e.key.toLowerCase() === 'e' || e.key === 'Enter') select();
  });
  document.addEventListener('wheel', e => {
    if (menu.classList.contains('hidden')) return;
    index = (index + (e.deltaY > 0 ? 1 : -1) + items.length) % items.length; render();
  });

  // From the game: { action: "open", items: [...], key: "E" } / { action: "close" }
  window.addEventListener('message', ({ data }) => {
    if (data.action === 'open') {
      if (data.items) items = data.items;
      if (data.key) document.getElementById('key').textContent = data.key;
      index = 0;
      document.body.classList.remove('preview');
      menu.classList.remove('hidden');
      render();
    } else if (data.action === 'close') {
      menu.classList.add('hidden');
    }
  });

  render();
</script>
</body>
</html>
