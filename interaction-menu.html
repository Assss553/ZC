<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interaction Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #ee7a1e;
    --orange-line: #e4823c;
    --scale: 1.5;            /* overall size of the menu */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;   /* transparent in game (NUI) */
    /* Bahnschrift Condensed = the in-game font (Windows/FiveM); Barlow Condensed = web fallback */
    font-family: 'Bahnschrift Condensed', 'Bahnschrift', 'Barlow Condensed', 'Arial Narrow', sans-serif;
    font-stretch: condensed;
    font-weight: 600;
    user-select: none;
    overflow: hidden;
    min-height: 100vh;
  }
  body.preview { background: radial-gradient(circle at 50% 45%, #9a7650, #3a2c1e 80%); }

  .menu {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%) scale(var(--scale));
    display: flex;
    align-items: flex-start;
  }
  .menu.hidden { display: none; }

  /* ---- E key: slanted box + offset corner lines ---- */
  .key {
    position: relative;
    width: 33px;
    height: 29px;
    margin-top: -2px;
    margin-right: 13px;
    color: #fff;
    font-size: 22px;
    line-height: 29px;
    text-align: center;
  }
  .key::before {                 /* the box */
    content: "";
    position: absolute;
    inset: 0;
    transform: skewX(-4deg);
    background: rgba(128, 50, 4, 0.8);
    border: 1.5px solid #e8955c;
    z-index: -1;
  }
  .key::after {                  /* offset corner lines (top-left & bottom-right) */
    content: "";
    position: absolute;
    inset: -4px;
    transform: skewX(-4deg);
    --c: rgba(232, 149, 92, .9);
    background:
      linear-gradient(var(--c), var(--c)) left top    / 10px 1.5px no-repeat,
      linear-gradient(var(--c), var(--c)) left top    / 1.5px 9px  no-repeat,
      linear-gradient(var(--c), var(--c)) right bottom / 10px 1.5px no-repeat,
      linear-gradient(var(--c), var(--c)) right bottom / 1.5px 9px  no-repeat;
    z-index: -2;
  }

  /* ---- options ---- */
  .options { display: flex; flex-direction: column; gap: 7px; }
  .option {
    display: flex;
    align-items: center;
    height: 25px;
    cursor: pointer;
  }

  .radio {
    width: 14px;
    height: 14px;
    margin-right: 22px;
    border-radius: 50%;
    border: 1.5px solid rgba(190, 186, 178, .9);
    background: rgba(25, 20, 15, .45);
    flex-shrink: 0;
  }
  .option.active .radio {
    border: 1.2px solid #e8843a;
    background: radial-gradient(circle, var(--orange) 0 3.6px, rgba(70, 28, 4, .9) 4.1px);
  }

  .label {
    position: relative;
    width: 200px;
    height: 25px;
    color: #f4eee6;
    font-size: 18.5px;
    line-height: 25px;
    text-align: center;
    text-shadow: 0 1px 1px rgba(0, 0, 0, .35);
  }
  /* skewed parallelogram behind the text */
  .label::before {
    content: "";
    position: absolute;
    inset: 0;
    transform: skewX(-22deg);
    z-index: -1;
    background: rgba(35, 32, 30, .5);
    border: 1.5px solid rgba(215, 210, 200, .9);
  }
  .label span { position: relative; z-index: 1; }

  .option.active .label::before {
    background: rgba(140, 60, 8, .6);
    border-color: var(--orange-line);
  }
</style>
</head>
<body class="preview">

<div class="menu" id="menu">
  <div class="key" id="key">E</div>
  <div class="options" id="options"></div>
</div>

<script>
  let items = [
    { label: "Browse IAA Vehicles",          action: "browse_vehicles" },
    { label: "Return Nearby IAA Vehicle",    action: "return_vehicle" },
    { label: "Retrieve IAA Helicopter",      action: "retrieve_heli" },
    { label: "Return Nearby IAA Helicopter", action: "return_heli" }
  ];
  let index = 0;
  const menu = document.getElementById('menu');
  const list = document.getElementById('options');

  function render() {
    list.innerHTML = '';
    items.forEach((it, i) => {
      const el = document.createElement('div');
      el.className = 'option' + (i === index ? ' active' : '');
      el.innerHTML = `<div class="radio"></div><div class="label"><span></span></div>`;
      el.querySelector('span').textContent = it.label;
      el.onmouseenter = () => { index = i; render(); };
      el.onclick = () => { index = i; select(); };
      list.appendChild(el);
    });
  }

  function select() {
    const it = items[index];
    console.log('Selected:', it.action);
    // FiveM NUI callback (ignored outside the game)
    if (typeof GetParentResourceName === 'function') {
      fetch(`https://${GetParentResourceName()}/select`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(it)
      });
    }
  }

  document.addEventListener('keydown', e => {
    if (menu.classList.contains('hidden')) return;
    if (e.key === 'ArrowDown') { index = (index + 1) % items.length; render(); }
    if (e.key === 'ArrowUp')   { index = (index - 1 + items.length) % items.length; render(); }
    if (e.key.toLowerCase() === 'e' || e.key === 'Enter') select();
  });
  document.addEventListener('wheel', e => {
    if (menu.classList.contains('hidden')) return;
    index = (index + (e.deltaY > 0 ? 1 : -1) + items.length) % items.length; render();
  });

  // From the game: { action: "open", items: [...], key: "E" } / { action: "close" }
  window.addEventListener('message', ({ data }) => {
    if (data.action === 'open') {
      if (data.items) items = data.items;
      if (data.key) document.getElementById('key').textContent = data.key;
      index = 0;
      document.body.classList.remove('preview');
      menu.classList.remove('hidden');
      render();
    } else if (data.action === 'close') {
      menu.classList.add('hidden');
    }
  });

  render();
</script>
</body>
</html>
