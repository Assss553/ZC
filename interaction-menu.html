<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interaction Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #eb6a10;
    --orange-line: #e4772c;
    --scale: 1.5;            /* overall size of the menu */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;   /* transparent in game (NUI) */
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    font-weight: 500;
    user-select: none;
    overflow: hidden;
    min-height: 100vh;
  }
  body.preview { background: radial-gradient(circle at 50% 45%, #8a6a48, #2a2018 75%); }

  .menu {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%) scale(var(--scale));
    display: flex;
    align-items: flex-start;
  }
  .menu.hidden { display: none; }

  /* ---- E key ---- */
  .key {
    position: relative;
    width: 34px;
    height: 31px;
    margin-top: -4px;
    margin-right: 10px;
    background: rgba(125, 50, 8, 0.88);
    border: 1.5px solid #e08a52;
    color: #fff;
    font-size: 19px;
    line-height: 28px;
    text-align: center;
  }
  .key::before, .key::after {
    content: "";
    position: absolute;
    width: 8px;
    height: 8px;
    border: 0 solid #e08a52;
  }
  .key::before { top: -4px; left: -4px; border-top-width: 1.5px; border-left-width: 1.5px; }
  .key::after  { bottom: -4px; right: -4px; border-bottom-width: 1.5px; border-right-width: 1.5px; }

  /* ---- options ---- */
  .options { display: flex; flex-direction: column; gap: 7px; }
  .option {
    display: flex;
    align-items: center;
    height: 25px;
    cursor: pointer;
  }

  .radio {
    width: 13px;
    height: 13px;
    margin-right: 22px;
    border-radius: 50%;
    border: 1.5px solid rgba(200, 200, 200, .85);
    background: rgba(30, 25, 20, .45);
    flex-shrink: 0;
  }
  .option.active .radio {
    border: 1.5px solid var(--orange);
    background: radial-gradient(circle, var(--orange) 0 3.2px, rgba(60, 25, 5, .85) 3.7px);
  }

  .label {
    position: relative;
    width: 196px;
    height: 25px;
    color: #fff;
    font-size: 15px;
    line-height: 25px;
    text-align: center;
    letter-spacing: -.1px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .45);
  }
  /* skewed parallelogram behind the text */
  .label::before {
    content: "";
    position: absolute;
    inset: 0;
    transform: skewX(-22deg);
    z-index: -1;
    background: linear-gradient(180deg, rgba(55, 50, 45, .42), rgba(70, 62, 52, .32));
    border: 1px solid rgba(225, 222, 212, .85);
    border-top-width: 1.5px;
  }
  .label span { position: relative; z-index: 1; }

  .option.active .label::before {
    background: linear-gradient(180deg, rgba(110, 45, 5, .72), rgba(125, 55, 12, .62));
    border: 1px solid var(--orange-line);
    border-top-width: 1.5px;
  }
</style>
</head>
<body class="preview">

<div class="menu" id="menu">
  <div class="key" id="key">E</div>
  <div class="options" id="options"></div>
</div>

<script>
  let items = [
    { label: "Browse IAA Vehicles",          action: "browse_vehicles" },
    { label: "Return Nearby IAA Vehicle",    action: "return_vehicle" },
    { label: "Retrieve IAA Helicopter",      action: "retrieve_heli" },
    { label: "Return Nearby IAA Helicopter", action: "return_heli" }
  ];
  let index = 0;
  const menu = document.getElementById('menu');
  const list = document.getElementById('options');

  function render() {
    list.innerHTML = '';
    items.forEach((it, i) => {
      const el = document.createElement('div');
      el.className = 'option' + (i === index ? ' active' : '');
      el.innerHTML = `<div class="radio"></div><div class="label"><span></span></div>`;
      el.querySelector('span').textContent = it.label;
      el.onmouseenter = () => { index = i; render(); };
      el.onclick = () => { index = i; select(); };
      list.appendChild(el);
    });
  }

  function select() {
    const it = items[index];
    console.log('Selected:', it.action);
    // FiveM NUI callback (ignored outside the game)
    if (typeof GetParentResourceName === 'function') {
      fetch(`https://${GetParentResourceName()}/select`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(it)
      });
    }
  }

  document.addEventListener('keydown', e => {
    if (menu.classList.contains('hidden')) return;
    if (e.key === 'ArrowDown') { index = (index + 1) % items.length; render(); }
    if (e.key === 'ArrowUp')   { index = (index - 1 + items.length) % items.length; render(); }
    if (e.key.toLowerCase() === 'e' || e.key === 'Enter') select();
  });
  document.addEventListener('wheel', e => {
    if (menu.classList.contains('hidden')) return;
    index = (index + (e.deltaY > 0 ? 1 : -1) + items.length) % items.length; render();
  });

  // From the game: { action: "open", items: [...], key: "E" } / { action: "close" }
  window.addEventListener('message', ({ data }) => {
    if (data.action === 'open') {
      if (data.items) items = data.items;
      if (data.key) document.getElementById('key').textContent = data.key;
      index = 0;
      document.body.classList.remove('preview');
      menu.classList.remove('hidden');
      render();
    } else if (data.action === 'close') {
      menu.classList.add('hidden');
    }
  });

  render();
</script>
</body>
</html>
