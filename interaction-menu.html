<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interaction Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #e3650e;
    --scale: 1.4;            /* overall size of the menu */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;   /* transparent in game (NUI) */
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    font-weight: 400;
    user-select: none;
    overflow: hidden;
    min-height: 100vh;
  }
  body.preview { background: radial-gradient(circle at 50% 45%, #5a4a3c, #1d1a17 75%); }

  .menu {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%) scale(var(--scale));
    display: flex;
    align-items: flex-start;
  }
  .menu.hidden { display: none; }

  /* ---- E key (matches reference: 45% orange fill + corner brackets) ---- */
  .key {
    position: relative;
    width: 34px;
    height: 31px;
    margin-top: -3px;
    margin-right: 14px;
    background: rgba(231, 122, 49, 0.45);
    border-top: 2px solid #e2742f;
    border-left: 1.5px solid #d76c28;
    border-right: 1.5px solid #cb7132;
    border-bottom: 1.5px solid rgba(242, 213, 195, 0.85);
    color: #fff;
    font-size: 19px;
    line-height: 27px;
    text-align: center;
    transform: skewX(-2deg);
  }
  .key::before, .key::after {
    content: "";
    position: absolute;
    width: 9px;
    height: 9px;
    border: 0 solid #d0661f;
  }
  .key::before { top: -5px; left: -5px; border-top-width: 2px; border-left-width: 2px; }
  .key::after  { bottom: -5px; right: -5px; border-bottom-width: 2px; border-right-width: 2px; }

  /* ---- options ---- */
  .options { display: flex; flex-direction: column; gap: 6px; }
  .option {
    display: flex;
    align-items: center;
    height: 27px;
    cursor: pointer;
  }

  .radio {
    width: 13px;
    height: 13px;
    margin-right: 18px;
    border-radius: 50%;
    border: 1.5px solid rgba(215, 215, 215, .9);
    background: rgba(40, 40, 40, .55);
    flex-shrink: 0;
  }
  .option.active .radio {
    border-color: #f5a070;
    background: var(--orange);
    box-shadow: 0 0 5px rgba(227, 101, 14, .8);
  }

  .label {
    position: relative;
    width: 200px;
    height: 27px;
    color: #fff;
    font-size: 15px;
    line-height: 28px;
    text-align: center;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .55);
  }
  /* skewed parallelogram behind the text */
  .label::before {
    content: "";
    position: absolute;
    inset: 0;
    transform: skewX(-15deg);
    z-index: -1;
    /* inactive: same 40% transparency, grey tones, white top bar */
    background: linear-gradient(180deg, rgba(45, 45, 45, .4), rgba(140, 135, 130, .4));
    border: 1px solid rgba(235, 235, 235, .7);
    border-top: 2.5px solid rgba(240, 240, 240, .95);
  }
  .label span { position: relative; z-index: 1; }

  /* active: colours sampled from the reference image */
  .option.active .label::before {
    background: linear-gradient(180deg, rgba(59, 32, 17, .4), rgba(184, 87, 22, .4));
    border: 1px solid rgba(255, 195, 160, .7);
    border-left-color: rgba(227, 101, 14, .75);
    border-top: 2.5px solid var(--orange);
  }
</style>
</head>
<body class="preview">

<div class="menu" id="menu">
  <div class="key" id="key">E</div>
  <div class="options" id="options"></div>
</div>

<script>
  let items = [
    { label: "Browse IAA Vehicles",          action: "browse_vehicles" },
    { label: "Return Nearby IAA Vehicle",    action: "return_vehicle" },
    { label: "Retrieve IAA Helicopter",      action: "retrieve_heli" },
    { label: "Return Nearby IAA Helicopter", action: "return_heli" }
  ];
  let index = 0;
  const menu = document.getElementById('menu');
  const list = document.getElementById('options');

  function render() {
    list.innerHTML = '';
    items.forEach((it, i) => {
      const el = document.createElement('div');
      el.className = 'option' + (i === index ? ' active' : '');
      el.innerHTML = `<div class="radio"></div><div class="label"><span></span></div>`;
      el.querySelector('span').textContent = it.label;
      el.onmouseenter = () => { index = i; render(); };
      el.onclick = () => { index = i; select(); };
      list.appendChild(el);
    });
  }

  function select() {
    const it = items[index];
    console.log('Selected:', it.action);
    // FiveM NUI callback (ignored outside the game)
    if (typeof GetParentResourceName === 'function') {
      fetch(`https://${GetParentResourceName()}/select`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(it)
      });
    }
  }

  document.addEventListener('keydown', e => {
    if (menu.classList.contains('hidden')) return;
    if (e.key === 'ArrowDown') { index = (index + 1) % items.length; render(); }
    if (e.key === 'ArrowUp')   { index = (index - 1 + items.length) % items.length; render(); }
    if (e.key.toLowerCase() === 'e' || e.key === 'Enter') select();
  });
  document.addEventListener('wheel', e => {
    if (menu.classList.contains('hidden')) return;
    index = (index + (e.deltaY > 0 ? 1 : -1) + items.length) % items.length; render();
  });

  // From the game: { action: "open", items: [...], key: "E" } / { action: "close" }
  window.addEventListener('message', ({ data }) => {
    if (data.action === 'open') {
      if (data.items) items = data.items;
      if (data.key) document.getElementById('key').textContent = data.key;
      index = 0;
      document.body.classList.remove('preview');
      menu.classList.remove('hidden');
      render();
    } else if (data.action === 'close') {
      menu.classList.add('hidden');
    }
  });

  render();
</script>
</body>
</html>
