<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>VC2 Caravan</title>
<style>html,body{margin:0;height:100%;background:#cfd8e3;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
 "three-mesh-bvh":"https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.6/src/index.js",
 "three-bvh-csg":"https://cdn.jsdelivr.net/npm/three-bvh-csg@0.0.16/build/index.module.js"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';
import { Brush, Evaluator, SUBTRACTION, INTERSECTION } from 'three-bvh-csg';

const q = new URLSearchParams(location.search);
const W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(devicePixelRatio); r.setSize(W, H);
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.0;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(r), 0.04).texture;

// ---------- sky + simple outdoor world (so you can see outside through the glass)
{
  const c = document.createElement('canvas'); c.width = 4; c.height = 256; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, '#6f9fd8'); gr.addColorStop(0.55, '#b9d3ee'); gr.addColorStop(1, '#e8eef5');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const sky = new THREE.Mesh(new THREE.SphereGeometry(150, 32, 16), new THREE.MeshBasicMaterial({ map: t, side: THREE.BackSide, fog: false }));
  scene.add(sky);
}
scene.fog = new THREE.Fog(0xc9d9ea, 40, 140);
const asphalt = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshStandardMaterial({ color: 0x6d7076, roughness: 0.95 }));
asphalt.rotation.x = -Math.PI / 2; asphalt.receiveShadow = true; scene.add(asphalt);
const lineM = new THREE.MeshBasicMaterial({ color: 0xf2f2f2 });
for (let i = -6; i < 8; i++) { const l = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 0.15), lineM); l.rotation.x = -Math.PI / 2; l.position.set(i * 5, 0.003, -4.2); scene.add(l); }
const grassM = new THREE.MeshStandardMaterial({ color: 0x6c8f45, roughness: 1 });
const grass = new THREE.Mesh(new THREE.PlaneGeometry(300, 40), grassM); grass.rotation.x = -Math.PI / 2; grass.position.set(0, 0.004, 26); grass.receiveShadow = true; scene.add(grass);
const grass2 = grass.clone(); grass2.position.z = -30; scene.add(grass2);
const trunkM = new THREE.MeshStandardMaterial({ color: 0x5b4636, roughness: 1 }), leafM = new THREE.MeshStandardMaterial({ color: 0x3f6b2e, roughness: 1 });
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
for (let i = 0; i < 46; i++) {
  const side = i % 2 ? 1 : -1, x = -40 + rnd() * 90, z = side * (9 + rnd() * 25), h = 3 + rnd() * 4;
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.22, h * 0.45, 8), trunkM); tr.position.set(x, h * 0.22, z); tr.castShadow = true; scene.add(tr);
  const lf = new THREE.Mesh(new THREE.SphereGeometry(h * 0.33, 14, 10), leafM); lf.position.set(x, h * 0.6, z); lf.castShadow = true; scene.add(lf);
}
const bM = [0xd8cfc2, 0xbfc7cf, 0xe3dccf, 0xa9b3bd].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.9 }));
for (let i = 0; i < 12; i++) { const h = 5 + rnd() * 12, b = new THREE.Mesh(new THREE.BoxGeometry(8 + rnd() * 6, h, 8), bM[i % 4]); b.position.set(-50 + i * 10, h / 2, i % 2 ? 45 : -50); scene.add(b); }

scene.add(new THREE.HemisphereLight(0xdfeaff, 0x6d7076, 1.1));
const sun = new THREE.DirectionalLight(0xfff3e0, 2.6); sun.position.set(14, 22, 12); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096); Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 80 }); sun.shadow.bias = -0.0004; scene.add(sun);

// ---------- materials
const M = (name, o, phys) => { const m = phys ? new THREE.MeshPhysicalMaterial(o) : new THREE.MeshStandardMaterial(o); m.name = name; return m; };
const paint = M('vc2_paint', { color: 0xf4f5f7, roughness: 0.22, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.08 }, true);
const interior = M('vc2_interior_wall', { color: 0xdcd6cc, roughness: 0.85 });
const ceiling = M('vc2_interior_ceiling', { color: 0xf6f5f2, roughness: 0.9 });
const graphite = M('vc2_graphite', { color: 0x2b2d33, roughness: 0.35, metalness: 0.5 });
const trim = M('vc2_trim', { color: 0x1a1b1f, roughness: 0.6, metalness: 0.2 });
const rubber = M('vc2_seal', { color: 0x111214, roughness: 0.8 });
const glass = M('vc2_glass_clear', { color: 0xffffff, roughness: 0.0, metalness: 0.0, transparent: true, opacity: 0.12, envMapIntensity: 1.2, side: THREE.DoubleSide, depthWrite: false });
const mirrorMat = M('vc2_mirror', { color: 0xffffff, roughness: 0.0, metalness: 1.0, envMapIntensity: 1.0 });
const chrome = M('vc2_chrome', { color: 0xe6e8ec, roughness: 0.08, metalness: 1.0 });
const tyreM = M('vc2_tyre', { color: 0x1b1b1c, roughness: 0.88 });
const rimM = M('vc2_rim', { color: 0xc9ccd2, roughness: 0.22, metalness: 0.95 });
const steelM = M('vc2_rim_dark', { color: 0x3a3c41, roughness: 0.4, metalness: 0.8 });
const orange = M('vc2_accent', { color: 0xe4501c, roughness: 0.35, metalness: 0.2 });
const lamp = M('vc2_headlight', { color: 0xfff9ee, emissive: 0xfff1d6, emissiveIntensity: 0.5, roughness: 0.1 });
const tail = M('vc2_taillight', { color: 0xb3141b, emissive: 0xc0141b, emissiveIntensity: 0.35 });
const amber = M('vc2_marker', { color: 0xff8a2a, emissive: 0xff7a1a, emissiveIntensity: 0.8 });
const ledStrip = M('vc2_led', { color: 0xff6a2b, emissive: 0xe4501c, emissiveIntensity: 1.2 });
const ceilLed = M('vc2_ceiling_light', { color: 0xffffff, emissive: 0xfff6e6, emissiveIntensity: 2.2 });
const seatM = M('vc2_seat', { color: 0x2c2e33, roughness: 0.75 });
const dashM = M('vc2_dash', { color: 0x232428, roughness: 0.7 });
// vinyl plank floor
const floorTex = (() => {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 1024; const g = c.getContext('2d');
  for (let i = 0; i < 8; i++) for (let j = 0; j < 3; j++) {
    const l = 52 + Math.floor(rnd() * 14); g.fillStyle = `hsl(32,28%,${l}%)`; const off = (i % 2) * 170;
    g.fillRect(j * 341 + off - 341, i * 128, 341, 128); g.fillRect(j * 341 + off, i * 128, 341, 128);
    for (let k = 0; k < 30; k++) { g.strokeStyle = `hsla(30,30%,${l - 10}%,.25)`; g.beginPath(); const y = i * 128 + rnd() * 128; g.moveTo(0, y); g.bezierCurveTo(300, y + rnd() * 8, 700, y - rnd() * 8, 1024, y); g.stroke(); }
  }
  g.strokeStyle = 'rgba(40,25,15,.35)'; g.lineWidth = 3; for (let i = 0; i <= 8; i++) { g.beginPath(); g.moveTo(0, i * 128); g.lineTo(1024, i * 128); g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2.5, 1); t.name = 'vc2_floor_tex'; return t;
})();
const floorM = M('vc2_floor', { map: floorTex, roughness: 0.55 });

// ---------- helpers
const RV = new THREE.Group(); RV.name = 'vc2caravan'; scene.add(RV);
const add = (name, geo, mat, x, y, z, rx = 0, ry = 0, rz = 0, parent = RV) => {
  const m = new THREE.Mesh(geo, mat); m.name = name; m.position.set(x, y, z); m.rotation.set(rx, ry, rz);
  m.castShadow = m.receiveShadow = true; parent.add(m); return m;
};
const RB = (w, h, d, rad = 0.04, s = 2) => new RoundedBoxGeometry(w, h, d, s, rad);
const clean = g => { g = g.index ? g.toNonIndexed() : g; for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k); if (!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2)); return g; };
const extrude = (shape, width, bevel = 0.04) => {
  const g = new THREE.ExtrudeGeometry(shape, { depth: width - bevel * 2, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3, curveSegments: 20 });
  g.translate(0, 0, -(width - bevel * 2) / 2); return clean(g);
};
const ev = new Evaluator(); ev.useGroups = true; ev.attributes = ['position', 'normal', 'uv'];
const brush = (geo, mat, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) => { const b = new Brush(clean(geo), mat); b.position.set(x, y, z); b.rotation.set(rx, ry, rz); b.updateMatrixWorld(); return b; };
const sub = (a, b) => { const o = ev.evaluate(a, b, SUBTRACTION); o.updateMatrixWorld(); return o; };
const inter = (a, b, mat) => { ev.useGroups = false; const o = ev.evaluate(a, b, INTERSECTION); ev.useGroups = true; o.material = mat; o.updateMatrixWorld(); return o; };
const toMesh = (b, name, parent = RV) => { const m = new THREE.Mesh(b.geometry, b.material); m.name = name; m.castShadow = m.receiveShadow = true; parent.add(m); return m; };

const WB = 2.45, CAB = 2.24;

// ---------- living box: solid minus interior volume = real hollow shell
function boxShape(t) {
  const s = new THREE.Shape();
  s.moveTo(0.05 + t, 0.62 + t * 1.6);
  s.lineTo(5.55 - t, 0.62 + t * 1.6);
  s.lineTo(5.55 - t, 2.2 + t);
  s.lineTo(6.05, 2.22 + t);
  s.bezierCurveTo(6.9 - t, 2.24 + t, 7.45 - t * 1.8, 2.45 + t, 7.42 - t * 1.8, 2.78);
  s.bezierCurveTo(7.38 - t * 1.8, 3.08 - t, 7.0 - t, 3.2 - t, 6.3, 3.25 - t);
  s.lineTo(0.35, 3.3 - t);
  s.quadraticCurveTo(0.02 + t, 3.3 - t, 0.02 + t, 2.98);
  s.lineTo(0.05 + t, 0.62 + t * 1.6);
  return s;
}
let shell = sub(brush(extrude(boxShape(0), WB, 0.06), paint), brush(extrude(boxShape(0.05), WB - 0.14, 0), interior));
// window, door, skylight and cab pass-through openings
const winList = [
  { n: 'window_lounge_r', x: 2.55, y: 2.33, w: 1.05, h: 0.6, s: 1 }, { n: 'window_lounge_l', x: 2.05, y: 2.33, w: 0.95, h: 0.6, s: -1 },
  { n: 'window_rear_r', x: 0.95, y: 2.38, w: 0.72, h: 0.52, s: 1 }, { n: 'window_rear_l', x: 0.95, y: 2.38, w: 0.72, h: 0.52, s: -1 },
  { n: 'window_bunk_r', x: 6.6, y: 2.74, w: 0.6, h: 0.3, s: 1 }, { n: 'window_bunk_l', x: 6.6, y: 2.74, w: 0.6, h: 0.3, s: -1 },
];
for (const w of winList) shell = sub(shell, brush(RB(w.w, w.h, 0.4, 0.06), interior, w.x, w.y, w.s * WB / 2));
const DOOR = { x: 3.65, y: 1.6, w: 0.72, h: 1.78 };
const doorCut = brush(RB(DOOR.w, DOOR.h, 0.4, 0.05), interior, DOOR.x, DOOR.y, WB / 2);
let doorPanel = inter(shell, brush(RB(DOOR.w - 0.02, DOOR.h - 0.02, 0.4, 0.05), paint, DOOR.x, DOOR.y, WB / 2), paint);
shell = sub(shell, doorCut);
doorPanel = sub(doorPanel, brush(RB(0.42, 0.6, 0.4, 0.05), interior, DOOR.x, 2.06, WB / 2));
shell = sub(shell, brush(RB(0.6, 0.4, 0.6, 0.05), interior, 3.0, 3.3, 0.45));                 // skylight
// slide-out openings (the slide-out boxes are separate parts that move out when deployed)
const SL = { x0: 2.65, x1: 5.25, y0: 0.78, y1: 2.95, D: 0.72, out: 0.66 };            // side slide-out (wider)
const SR = { z0: -0.85, z1: 0.85, y0: 0.8, y1: 2.9, D: 0.7, out: 0.6, x: -0.01 };      // rear slide-out (longer)
SL.L = SL.x1 - SL.x0; SL.H = SL.y1 - SL.y0; SR.L = SR.z1 - SR.z0; SR.H = SR.y1 - SR.y0;
shell = sub(shell, brush(RB(SL.L, SL.H, 0.4, 0.04), interior, SL.x0 + SL.L / 2, SL.y0 + SL.H / 2, -WB / 2));
shell = sub(shell, brush(RB(0.4, SR.H, SR.L, 0.04), interior, 0.0, SR.y0 + SR.H / 2, 0));
shell = sub(shell, brush(RB(0.6, 1.45, CAB - 0.5, 0.08), interior, 5.5, 1.45, 0));            // open pass-through to the cab
toMesh(shell, 'bodyshell');

// ---------- cab: hollow, real windshield / side window openings, opening doors
function cabShape() {
  const s = new THREE.Shape();
  s.moveTo(5.42, 0.55); s.lineTo(7.78, 0.55); s.quadraticCurveTo(7.9, 0.58, 7.9, 0.75); s.lineTo(7.86, 1.12);
  s.quadraticCurveTo(7.82, 1.22, 7.6, 1.24); s.lineTo(6.95, 1.33); s.lineTo(6.5, 2.12); s.lineTo(5.42, 2.18); s.lineTo(5.42, 0.55); return s;
}
function cabInner() {
  const s = new THREE.Shape();
  s.moveTo(5.3, 0.72); s.lineTo(6.9, 0.72); s.lineTo(6.9, 1.27); s.lineTo(6.48, 2.05); s.lineTo(5.3, 2.1); s.lineTo(5.3, 0.72); return s;
}
let cab = sub(brush(extrude(cabShape(), CAB, 0.07), paint), brush(extrude(cabInner(), CAB - 0.14, 0), interior));
const wsAng = Math.atan2(0.45, 0.79), wsC = new THREE.Vector3(6.725 + 0.79 * 0.08, 1.725 + 0.45 * 0.08, 0);
{ const b = new Brush(clean(RB(0.4, 0.76, CAB - 0.24, 0.05)), interior); b.position.copy(wsC); b.rotation.set(0, 0, wsAng); b.updateMatrixWorld(); cab = sub(cab, b); }
const cabWin = () => { const s = new THREE.Shape(); s.moveTo(5.78, 1.42); s.lineTo(6.83, 1.42); s.lineTo(6.46, 2.04); s.lineTo(5.78, 2.06); s.closePath(); return s; };
const cabDoorShape = () => { const s = new THREE.Shape(); s.moveTo(5.6, 0.66); s.lineTo(6.92, 0.66); s.lineTo(6.92, 1.3); s.lineTo(6.5, 2.1); s.lineTo(5.6, 2.12); s.closePath(); return s; };
const cabDoors = {};
for (const sd of [-1, 1]) {
  const z = sd * CAB / 2;
  const cut = brush(extrude(cabDoorShape(), 0.3, 0), interior, 0, 0, z);
  let door = inter(cab, brush(extrude(cabDoorShape(), 0.3, 0), paint, 0, 0, z), paint);
  cab = sub(cab, cut);
  door = sub(door, brush(extrude(cabWin(), 0.4, 0), interior, 0, 0, z));
  cabDoors[sd] = door;
}
toMesh(cab, 'cab_shell');
// windshield glass + rubber seal
{ const ws = add('windscreen', new THREE.PlaneGeometry(CAB - 0.26, 0.78), glass, wsC.x - 0.79 * 0.03, wsC.y - 0.45 * 0.03, 0); ws.rotation.set(0, Math.PI / 2, wsAng, 'ZYX'); ws.castShadow = false; }

// cab doors (pivot at the front hinge) with clear glass + handle + mirror
const mirrorFaces = [];
for (const sd of [-1, 1]) {
  const name = sd < 0 ? 'door_dside_f' : 'door_pside_f';
  const piv = new THREE.Group(); piv.name = name; piv.position.set(6.9, 1.0, sd * CAB / 2); RV.add(piv);
  const dm = new THREE.Mesh(cabDoors[sd].geometry, cabDoors[sd].material); dm.name = name + '_panel'; dm.position.set(-6.9, -1.0, -sd * CAB / 2); dm.castShadow = dm.receiveShadow = true; piv.add(dm);
  const gw = new THREE.Mesh(new THREE.ShapeGeometry(cabWin()), glass); gw.name = sd < 0 ? 'window_lf' : 'window_rf'; gw.position.set(-6.9, -1.0, -sd * 0.03); piv.add(gw);
  add(name + '_handle', RB(0.16, 0.035, 0.03, 0.01), chrome, 5.95 - 6.9, 1.32 - 1.0, sd * 0.012, 0, 0, 0, piv);
  // side mirror: arm + housing + REFLECTIVE glass
  add(name + '_mirror_arm', new THREE.CylinderGeometry(0.018, 0.018, 0.34, 8), trim, 6.62 - 6.9, 1.58 - 1.0, sd * 0.14, Math.PI / 2, 0, 0, piv);
  const housing = add(name + '_mirror', RB(0.1, 0.42, 0.26, 0.035), graphite, 6.64 - 6.9, 1.6 - 1.0, sd * 0.34, 0, -sd * 0.22, 0, piv);
  const face = add(name + '_mirror_glass', new THREE.PlaneGeometry(0.22, 0.36), mirrorMat, 6.585 - 6.9, 1.6 - 1.0, sd * 0.34 - sd * 0.012, 0, -Math.PI / 2 - sd * 0.22, 0, piv);
  mirrorFaces.push(face);
}
// cab interior: dashboard, steering wheel, seats, pedals
add('dashboard', RB(0.42, 0.26, CAB - 0.2, 0.06), dashM, 6.72, 1.18, 0);
add('dash_top', RB(0.3, 0.05, CAB - 0.26, 0.02), dashM, 6.66, 1.33, 0);
add('instrument_cluster', RB(0.04, 0.12, 0.38, 0.02), M('vc2_cluster', { color: 0x0f1013, emissive: 0xe4501c, emissiveIntensity: 0.25 }), 6.5, 1.32, -0.5);
{ const sw = new THREE.Group(); sw.name = 'steeringw'; sw.position.set(6.3, 1.32, -0.5); sw.rotation.set(0, 0, 0.55); RV.add(sw);
  add('steeringw_rim', new THREE.TorusGeometry(0.19, 0.022, 10, 40), dashM, 0, 0, 0, 0, Math.PI / 2, 0, sw);
  add('steeringw_hub', new THREE.CylinderGeometry(0.06, 0.06, 0.05, 20), dashM, 0, 0, 0, 0, 0, Math.PI / 2, sw);
  for (const a of [0, 2.1, 4.2]) add('steeringw_spoke', RB(0.02, 0.17, 0.03, 0.01), dashM, 0, Math.cos(a) * 0.09, Math.sin(a) * 0.09, a, 0, 0, sw);
  add('steering_column', new THREE.CylinderGeometry(0.035, 0.035, 0.4, 12), dashM, 6.5, 1.2, -0.5, 0, 0, Math.PI / 2 + 0.55); }
for (const sd of [-1, 1]) {
  const n = sd < 0 ? 'seat_dside_f' : 'seat_pside_f', z = sd * 0.5;
  add(n, RB(0.52, 0.14, 0.52, 0.05), seatM, 5.75, 0.98, z);
  add(n + '_back', RB(0.14, 0.72, 0.52, 0.06), seatM, 5.48, 1.38, z, 0, 0, -0.12);
  add(n + '_head', RB(0.1, 0.2, 0.3, 0.05), seatM, 5.42, 1.84, z, 0, 0, -0.12);
  add(n + '_base', RB(0.4, 0.24, 0.4, 0.02), trim, 5.75, 0.8, z);
}
add('cab_floor', new THREE.BoxGeometry(1.5, 0.02, CAB - 0.16), M('vc2_cab_floor', { color: 0x1d1e21, roughness: 0.95 }), 6.1, 0.73, 0);

// ---------- living area interior: EMPTY (floor, walls, ceiling, lights only)
add('floor', new THREE.PlaneGeometry(5.4, WB - 0.16), floorM, 2.8, 0.705, 0, -Math.PI / 2);
add('floor_cab_step', new THREE.BoxGeometry(0.3, 0.02, CAB - 0.5), floorM, 5.4, 0.72, 0);
for (const x of [1.2, 2.6, 4.0]) add('ceiling_light_' + x, RB(0.5, 0.025, 0.14, 0.012), ceilLed, x, 3.24, 0);
add('ceiling_led_strip_l', RB(5.0, 0.02, 0.02, 0.006), ceilLed, 2.8, 3.22, -1.05);
add('ceiling_led_strip_r', RB(5.0, 0.02, 0.02, 0.006), ceilLed, 2.8, 3.22, 1.05);
for (const sd of [-1, 1]) add('wheel_well_' + (sd < 0 ? 'l' : 'r'), RB(1.25, 0.26, 0.5, 0.08), interior, 1.95, 0.82, sd * (WB / 2 - 0.3));
add('bunk_floor', new THREE.BoxGeometry(1.75, 0.06, WB - 0.16), interior, 6.35, 2.28, 0);    // cab-over bunk deck (empty)
const insideLights = [];
for (const x of [1.2, 2.8, 4.4]) { const l = new THREE.PointLight(0xfff2de, q.get('lights') === '0' ? 0 : 1.3, 4.5, 1.6); l.position.set(x, 3.0, 0); scene.add(l); insideLights.push(l); }

// window / door frames (rubber-black rings)
const frame = (w, h, x, y, z, t, ry = 0) => { ev.useGroups = false; const o = ev.evaluate(brush(RB(w + t * 2, h + t * 2, 0.025, 0.06), rubber, x, y, z, 0, ry), brush(RB(w, h, 0.3, 0.05), rubber, x, y, z, 0, ry), SUBTRACTION); ev.useGroups = true; o.material = rubber; return o; };
// ---------- glass for every opening (clear) + rubber seals
for (const w of winList) {
  const z = w.s * (WB / 2 - 0.035);
  add(w.n, RB(w.w, w.h, 0.012, 0.05), glass, w.x, w.y, z).castShadow = false;
  toMesh(frame(w.w, w.h, w.x, w.y, w.s * (WB / 2 + 0.008), 0.045), w.n + '_frame');
}
add('window_skylight', RB(0.6, 0.012, 0.4, 0.05), glass, 3.0, 3.29, 0.45).castShadow = false;
add('skylight_frame', RB(0.7, 0.06, 0.5, 0.03), trim, 3.0, 3.36, 0.45).material = glass;
