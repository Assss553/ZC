// ---------- materials

    for (let k = 0; k < 30; k++) { g.strokeStyle = `hsla(30,30%,${l - 10}%,.25)`; g.beginPath(); const y = i * 128 + rnd() * 128; g.moveTo(0, y); g.bezierCurveTo(300, y + rnd() * 8, 700, y - rnd() * 8, 1024, y); g.stroke(); }

const add = (name, geo, mat, x, y, z, rx = 0, ry = 0, rz = 0, parent = RV) => {

  m.castShadow = m.receiveShadow = true; parent.add(m); return m;

const RB = (w, h, d, rad = 0.04, s = 2) => new RoundedBoxGeometry(w, h, d, s, rad);
const clean = g => { g = g.index ? g.toNonIndexed() : g; for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k); if (!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2)); return g; };

// ---------- living box: solid minus interior volume = real hollow shell
// LOFT: sculpted surface through cross-sections (superellipse rings) -> smooth, real-looking body panels
function loft(st, segs = 64, o = {}) {
  const P = [], I = [];
  const ringAt = s => {
    const out = [], cy = (s.b + s.t) / 2, h = (s.t - s.b) / 2, e = 2 / s.n;
    for (let j = 0; j < segs; j++) {
      const a = j / segs * Math.PI * 2, c = Math.cos(a), sn = Math.sin(a);
      let z = s.hw * Math.sign(c) * Math.abs(c) ** e;
      const y = cy + h * Math.sign(sn) * Math.abs(sn) ** e;
      if (o.belt !== undefined && y > o.belt && s.t > o.belt) z *= 1 - (1 - o.taper) * Math.min(1, (y - o.belt) / (s.t - o.belt));
      out.push(s.x, y, z);
    }
    return out;
  };
  st.forEach(s => P.push(...ringAt(s)));
  const R0 = 0, RN = st.length - 1;
  for (let i = 0; i < RN; i++) for (let j = 0; j < segs; j++) {
    const a = i * segs + j, b = i * segs + (j + 1) % segs, c = (i + 1) * segs + j, d = (i + 1) * segs + (j + 1) % segs;
    I.push(a, b, c, b, d, c);
  }

  const cap = (ri, flip) => {
    const s = st[ri], ci = P.length / 3; P.push(s.x, (s.b + s.t) / 2, 0);
    for (let j = 0; j < segs; j++) { const a = ri * segs + j, b = ri * segs + (j + 1) % segs; flip ? I.push(ci, b, a) : I.push(ci, a, b); }
  };
  cap(R0, false); cap(RN, true);
  let g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); g.setIndex(I);
  // make sure the faces point outwards (signed volume > 0)
  const p = g.attributes.position.array; let vol = 0;
  for (let k = 0; k < I.length; k += 3) { const [a, b, c] = [I[k] * 3, I[k + 1] * 3, I[k + 2] * 3];
    vol += p[a] * (p[b + 1] * p[c + 2] - p[b + 2] * p[c + 1]) - p[a + 1] * (p[b] * p[c + 2] - p[b + 2] * p[c]) + p[a + 2] * (p[b] * p[c + 1] - p[b + 1] * p[c]); }
  if (vol < 0) { for (let k = 0; k < I.length; k += 3) { const t = I[k + 1]; I[k + 1] = I[k + 2]; I[k + 2] = t; } g.setIndex(I); }

  const uv = new Float32Array(P.length / 3 * 2); for (let k = 0; k < P.length / 3; k++) { uv[k * 2] = P[k * 3] / 8; uv[k * 2 + 1] = P[k * 3 + 1] / 4; }
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  return g;
}
const add2 = (a, b) => { const o = ev.evaluate(a, b, ADDITION); o.updateMatrixWorld(); return o; };
// cab-over cap: full width behind, tapering into a pointed nose; bottom rises, top drops (aerodynamic wedge)
const CAPST = [
  { x: 5.45, b: 2.2, t: 3.36, hw: 1.225, n: 9 }, { x: 6.45, b: 2.21, t: 3.35, hw: 1.225, n: 8.5 },

  { x: 7.32, b: 2.38, t: 3.0, hw: 1.1, n: 4.5 },  { x: 7.46, b: 2.45, t: 2.86, hw: 1.0, n: 3.6 },

];
const CAPIN = CAPST.slice(0, 6).map((s, i) => ({ x: s.x + (i === 0 ? 0.1 : 0), b: s.b + 0.06, t: s.t - 0.06, hw: s.hw - 0.07, n: s.n }));

const capTop = x => { for (let i = 0; i < CAPST.length - 1; i++) { const a = CAPST[i], b = CAPST[i + 1]; if (x >= a.x && x <= b.x) { const k = (x - a.x) / (b.x - a.x); return a.t + (b.t - a.t) * k; } } return CAPST[0].t; };

function boxShape(t) {

  s.lineTo(5.55 - t, 0.62 + t * 1.6);
  s.lineTo(5.6 - t, 3.3 - t);

const winList = [

// ---------- cab: hollow, real windshield / side window openings, opening doors
function cabShape() {
  const s = new THREE.Shape();
  s.moveTo(5.42, 0.55); s.lineTo(7.78, 0.55); s.quadraticCurveTo(7.9, 0.58, 7.9, 0.75); s.lineTo(7.86, 1.12);
  s.quadraticCurveTo(7.82, 1.22, 7.6, 1.24); s.lineTo(6.95, 1.33); s.lineTo(6.5, 2.12); s.lineTo(5.42, 2.18); s.lineTo(5.42, 0.55); return s;
}

  const s = new THREE.Shape();
  s.moveTo(5.3, 0.72); s.lineTo(6.9, 0.72); s.lineTo(6.9, 1.27); s.lineTo(6.48, 2.05); s.lineTo(5.3, 2.1); s.lineTo(5.3, 0.72); return s;
}
// sculpted van cab: tumblehome greenhouse, sloping/narrowing hood, rounded nose
const CABST = [
  { x: 5.4, b: 0.55, t: 2.18, hw: 1.12, n: 9 }, { x: 6.45, b: 0.55, t: 2.13, hw: 1.12, n: 9 },
  { x: 6.93, b: 0.55, t: 1.34, hw: 1.1, n: 7.5 }, { x: 7.3, b: 0.55, t: 1.29, hw: 1.07, n: 6 },
  { x: 7.62, b: 0.55, t: 1.23, hw: 1.03, n: 5 },  { x: 7.84, b: 0.56, t: 1.14, hw: 0.99, n: 4.2 },
  { x: 7.93, b: 0.6, t: 1.02, hw: 0.95, n: 3.6 },  { x: 7.97, b: 0.66, t: 0.9, hw: 0.86, n: 3.0 },

const CABIN = [
  { x: 5.3, b: 0.72, t: 2.1, hw: 1.05, n: 9 }, { x: 6.42, b: 0.72, t: 2.06, hw: 1.05, n: 9 }, { x: 6.86, b: 0.72, t: 1.28, hw: 1.03, n: 7 },
];

{ const b = new Brush(clean(RB(0.4, 0.76, CAB - 0.24, 0.05)), interior); b.position.copy(wsC); b.rotation.set(0, 0, wsAng); b.updateMatrixWorld(); cab = sub(cab, b); }

const cabDoorShape = () => { const s = new THREE.Shape(); s.moveTo(5.6, 0.66); s.lineTo(6.92, 0.66); s.lineTo(6.92, 1.3); s.lineTo(6.5, 2.1); s.lineTo(5.6, 2.12); s.closePath(); return s; };
const cabDoors = {};
for (const sd of [-1, 1]) {
  const z = sd * CAB / 2;
  const cut = brush(extrude(cabDoorShape(), 0.3, 0), interior, 0, 0, z);
  let door = inter(cab, brush(extrude(cabDoorShape(), 0.3, 0), paint, 0, 0, z), paint);

for (const sd of [-1, 1]) cabDoors[sd] = sub(cabDoors[sd], brush(new THREE.CylinderGeometry(0.52, 0.52, CAB + 0.4, 48), interior, 6.95, 0.42, 0, Math.PI / 2));
