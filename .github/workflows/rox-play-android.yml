name: ROX Play — Android build (direct PS4/PS5 pairing on the phone, based on chiaki-ng)

on:
  push:
    branches: [ "ccr-dcf102d9-fn7ygb", "main" ]
    paths: [ "ROX-GAME-AI/rox-play-android/**", ".github/workflows/rox-play-android.yml" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CHIAKI_COMMIT: 43728af2e639fecb8a7af1cd68c29820a40de973

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Get chiaki-ng source (pinned official commit)
        run: |
          git init chiaki && cd chiaki
          git remote add origin https://github.com/streetpea/chiaki-ng
          git fetch --depth 1 origin $CHIAKI_COMMIT
          git checkout FETCH_HEAD
          git submodule update --init --recursive --depth 1 third-party/nanopb third-party/jerasure third-party/gf-complete third-party/curl android/app/src/main/cpp/oboe
      - uses: actions/checkout@v4
        with: { path: rox-src }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Install NDK + CMake used by chiaki-ng
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler python3-protobuf > /dev/null
          protoc --version
      - name: Apply ROX Play branding
        working-directory: chiaki
        run: bash ../rox-src/ROX-GAME-AI/rox-play-android/apply-rox-android.sh
      - name: Reuse ROX signing keys (Actions cache only, never committed)
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/debug.keystore
            ~/.rox
          key: rox-play-android-keystore-v2
      - name: Build APK
        working-directory: chiaki/android
        env: { CMAKE_POLICY_VERSION_MINIMUM: "3.5" }
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease
          ls -la app/build/outputs/apk/debug/ app/build/outputs/apk/release/
      - name: Sign release (zipalign 16 KB + apksigner v1/v2/v3) and verify every APK
        run: |
          set -e
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          mkdir -p out ~/.rox
          KS=~/.rox/release.jks
          # Random password generated once on the runner and kept only in the Actions cache
          if [ ! -f ~/.rox/pw ]; then openssl rand -hex 24 > ~/.rox/pw; chmod 600 ~/.rox/pw; fi
          export PW=$(cat ~/.rox/pw); echo "::add-mask::$PW"
          if [ ! -f $KS ]; then keytool -genkeypair -keystore $KS -storepass "$PW" -keypass "$PW" -alias rox -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ROX Play" > /dev/null; fi
          U=$(ls chiaki/android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -f -P 16 4 "$U" aligned.apk
          $BT/apksigner sign --ks $KS --ks-pass env:PW --key-pass env:PW --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out out/ROX-Play-Android.apk aligned.apk
          D=$(ls chiaki/android/app/build/outputs/apk/debug/*.apk | head -1)
          cp "$D" out/ROX-Play-Android-debug.apk
          for f in out/*.apk; do
            echo "== $f"; ls -la "$f"
            $BT/apksigner verify -v "$f" | head -6
            $BT/zipalign -c -P 16 4 "$f" && echo "zipalign OK"
            $BT/aapt2 dump badging "$f" | grep -E "^package|sdkVersion|targetSdk|native-code"
          done
      - uses: actions/upload-artifact@v4
        with: { name: ROX-Play-Android, path: out/ }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: rox-play-android-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ROX Play Android build ${{ github.run_number }}
          make_latest: "false"
          files: out/*.apk
          body: |
            ROX Play for Android — pairs with your PS4/PS5 directly and streams to the phone (no Sony app).
            Based on chiaki-ng (AGPL-3.0); full source in ROX-GAME-AI/rox-play-android. Not affiliated with Sony.
