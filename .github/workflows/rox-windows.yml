name: ROX AI Agent — Windows build

on:
  workflow_dispatch:
  push:
    branches: [claude/rox-ai-desktop-agent-x39re2]
    paths: ["rox-ai-agent/**", ".github/workflows/rox-windows.yml"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: rox-ai-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Backend deps + tests
        working-directory: rox-ai-agent/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller keyrings.alt
          python -m pytest -q tests

      - name: Freeze backend (PyInstaller)
        working-directory: rox-ai-agent/backend
        run: |
          pyinstaller --noconfirm --log-level WARN --name rox-backend --onedir --noconsole `
            --collect-submodules rox --collect-submodules uvicorn --collect-submodules keyring `
            --hidden-import keyring.backends.Windows --hidden-import win32ctypes.core `
            --hidden-import cv2 --hidden-import pyautogui --hidden-import pygetwindow `
            run_backend.py

      - name: Smoke test frozen backend on Windows
        working-directory: rox-ai-agent/backend
        run: |
          $env:ROX_DATA_DIR = "$env:RUNNER_TEMP\rox-data"; $env:ROX_PORT = "8799"
          $p = Start-Process -FilePath "dist\rox-backend\rox-backend.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod "http://127.0.0.1:8799/api/status"; if ($r.is_windows) { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) {
            Get-Content "$env:ROX_DATA_DIR\logs\backend-crash.log" -ErrorAction SilentlyContinue
            throw "Frozen backend did not start"
          }
          Write-Host "Backend OK on Windows: admin=$($r.is_admin) capture=$($r.capture_available) input=$($r.input_available)"

      - name: Frontend build
        working-directory: rox-ai-agent/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
          if (Test-Path ..\desktop\renderer) { Remove-Item -Recurse -Force ..\desktop\renderer }
          Copy-Item -Recurse dist ..\desktop\renderer

      - name: Package (installer + portable exe)
        working-directory: rox-ai-agent/desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win --x64 --publish never
          Get-ChildItem dist\*.exe | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ROX-AI-Agent-Windows
          path: rox-ai-agent/desktop/dist/*.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rox-v0.1.${{ github.run_number }}
          name: ROX AI Agent 0.1.${{ github.run_number }} (Windows)
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: rox-ai-agent/desktop/dist/*.exe
          body: |
            **ROX-AI-Agent-Setup-*.exe** — installer (per-user, no admin, desktop shortcut).
            **ROX-AI-Agent-Portable-*.exe** — single file, runs without installing.
            Python is bundled; nothing else to install. Windows SmartScreen may warn because the build is unsigned: More info → Run anyway.
