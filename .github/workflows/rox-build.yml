name: Build ROX (Windows)
on:
  push:
    paths: ['ROX/**', '.github/workflows/rox-build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        run: dotnet publish ROX/ROX.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out
      - uses: actions/upload-artifact@v4
        with:
          name: ROX-windows
          path: out/ROX.exe
      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rox-v${{ github.run_number }}
          name: ROX v1.1.${{ github.run_number }}
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: out/ROX.exe
          body: "Download ROX.exe and run it (Windows 10/11, x64). No install needed."
