name: ROX Windows check

on:
  push:
    paths:
      - 'ROX/**'
      - '.github/workflows/rox-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell files
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem ROX -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) { Write-Host "::error file=ROX/$($f.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
            Write-Host "$($f.Name): $(@($errors).Count) parse error(s)"
          }
          [xml](Get-Content ROX\ROX.xaml -Raw -Encoding UTF8) | Out-Null
          Write-Host 'ROX.xaml is valid XML'
          if ($bad) { exit 1 }

      - name: Engine self-test (applies every tweak, then undoes it)
        shell: powershell
        continue-on-error: true
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ROX\ROX.ps1 -SelfTest

      - name: Render the UI and take screenshots
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ROX\ROX.ps1 -RenderTest "$env:RUNNER_TEMP\rox-shots"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rox-screenshots
          path: ${{ runner.temp }}/rox-shots
          if-no-files-found: warn
