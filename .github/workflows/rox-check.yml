name: ROX Windows check

on:
  push:
    paths:
      - 'ROX/**'
      - '.github/workflows/rox-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell files
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem ROX -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) { Write-Host "::error file=ROX/$($f.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
            Write-Host "$($f.Name): $(@($errors).Count) parse error(s)"
          }
          [xml](Get-Content ROX\ROX.xaml -Raw -Encoding UTF8) | Out-Null
          Write-Host 'ROX.xaml is valid XML'
          if ($bad) { exit 1 }

      - name: Engine self-test (applies every tweak, then undoes it)
        shell: powershell
        continue-on-error: true
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ROX\ROX.ps1 -SelfTest

      - name: Render the UI and take screenshots
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ROX\ROX.ps1 -RenderTest "$env:RUNNER_TEMP\rox-shots"

      - name: Print screenshots (JPEG, base64) into the log
        if: always()
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq 'image/jpeg' }
          $ep = New-Object System.Drawing.Imaging.EncoderParameters(1)
          $ep.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter([System.Drawing.Imaging.Encoder]::Quality, [long]82)
          foreach ($f in Get-ChildItem "$env:RUNNER_TEMP\rox-shots" -Filter *.png -ErrorAction SilentlyContinue) {
            $img = [System.Drawing.Image]::FromFile($f.FullName)
            $ms = New-Object System.IO.MemoryStream
            $img.Save($ms, $codec, $ep)
            $img.Dispose()
            $b64 = [Convert]::ToBase64String($ms.ToArray())
            for ($i = 0; $i -lt $b64.Length; $i += 3000) {
              Write-Host ("B64|{0}|{1}" -f $f.BaseName, $b64.Substring($i, [Math]::Min(3000, $b64.Length - $i)))
            }
          }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rox-screenshots
          path: ${{ runner.temp }}/rox-shots
          if-no-files-found: warn
