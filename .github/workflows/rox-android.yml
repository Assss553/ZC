name: ROX Android
on:
  push:
    paths: ["rox-android/**", ".github/workflows/rox-android.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    container: thestr4ng3r/android:f064ea6   # the image chiaki's own CI used (SDK, NDK, CMake, Java 8, protobuf)
    steps:
      - uses: actions/checkout@v3
      - name: Build APK
        working-directory: rox-android/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v3
        with:
          name: ROX-Android
          path: rox-android/android/app/build/outputs/apk/debug/*.apk
