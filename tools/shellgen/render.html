<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff;overflow:hidden}</style></head><body>
<script src="three.min.js"></script>
<script>
// Preview renderer for ROX shells: draws the real generated mesh + textures (cutaway, no ceiling)
const Q = new URLSearchParams(location.search);
const NAME = Q.get('name'), VIEW = Q.get('view') || 'iso', WPX = +(Q.get('w') || 1600), HPX = +(Q.get('h') || 900);
const BG = Q.get('bg') || 'ffffff';
(async () => {
  const data = await (await fetch(`preview/${NAME}.json`)).json();
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(WPX, HPX); renderer.setPixelRatio(1); document.body.appendChild(renderer.domElement);
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#' + BG);
  const loader = new THREE.TextureLoader(); const cache = {};
  const tex = (n, srgb) => new Promise((res) => { if (cache[n]) return res(cache[n]); loader.load(`tex/png/${n}.png`, (t) => { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.flipY = false; t.anisotropy = 8; if (srgb) t.colorSpace = THREE.SRGBColorSpace; cache[n] = t; res(t); }, undefined, () => res(null)); });
  const inside = VIEW === 'inside';
  for (const m of data.meshes) {
    if (m.tag === 'hull') continue;
    if (!inside && m.tag === 'ceil') continue;
    const g = new THREE.BufferGeometry();
    // GTA is Z-up, three is Y-up: (x, y, z) -> (x, z, -y)
    const P = new Float32Array(m.P.length), N = new Float32Array(m.N.length);
    for (let i = 0; i < m.P.length; i += 3) { P[i] = m.P[i]; P[i + 1] = m.P[i + 2]; P[i + 2] = -m.P[i + 1]; N[i] = m.N[i]; N[i + 1] = m.N[i + 2]; N[i + 2] = -m.N[i + 1]; }
    const C = new Float32Array(m.C.length * 3); m.C.forEach((c, i) => { const v = Math.pow(c, 1.6); C[i * 3] = C[i * 3 + 1] = C[i * 3 + 2] = v; });
    g.setAttribute('position', new THREE.BufferAttribute(P, 3)); g.setAttribute('normal', new THREE.BufferAttribute(N, 3));
    g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(m.UV), 2)); g.setAttribute('color', new THREE.BufferAttribute(C, 3));
    g.setIndex(m.I);
    const map = await tex(m.tex, true);
    let mat;
    if (m.sh === 'e') mat = new THREE.MeshBasicMaterial({ map, color: m.mat === 'light' ? 0xffffff : 0xf2f2f2 });
    else {
      const nm = (m.sh === 'ns' || m.sh === 'n') ? await tex(m.tex + '_n', false) : null;
      mat = new THREE.MeshStandardMaterial({ map, normalMap: nm, vertexColors: true, roughness: Math.max(0.25, 0.95 - m.spec * 0.65), metalness: (m.mat === 'steel' || m.mat === 'brass') ? 0.6 : 0.0 });
      if (nm) mat.normalScale = new THREE.Vector2(1, -1);
    }
    const mesh = new THREE.Mesh(g, mat); mesh.castShadow = m.sh !== 'e' && m.tag !== 'fix'; mesh.receiveShadow = true; scene.add(mesh);
  }
  const bb = data.bb, cx = (bb[0] + bb[3]) / 2, cy = (bb[1] + bb[4]) / 2, sx = bb[3] - bb[0], sy = bb[4] - bb[1], H = bb[5];
  scene.add(new THREE.HemisphereLight(0xffffff, 0xb0a898, inside ? 0.35 : 0.95));
  const sun = new THREE.DirectionalLight(0xfff4e2, inside ? 0 : 1.5); sun.position.set(cx + 14, 30, -cy + 18); sun.target.position.set(cx, 0, -cy); scene.add(sun.target);
  sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); const sc = sun.shadow.camera; const R = Math.max(sx, sy) * 0.8; sc.left = -R; sc.right = R; sc.top = R; sc.bottom = -R; sc.far = 100; sun.shadow.bias = -0.0015; sun.shadow.normalBias = 0.03; scene.add(sun);
  data.lights.forEach((l, i) => { const p = new THREE.PointLight(new THREE.Color(l.c[0] / 255, l.c[1] / 255, l.c[2] / 255), (inside ? 14 : 5) * l.i / 4, l.f * 1.6, 1.4); p.position.set(l.p[0], l.p[2], -l.p[1]); scene.add(p); });
  const aspect = WPX / HPX; let cam;
  if (inside) {
    cam = new THREE.PerspectiveCamera(74, aspect, 0.05, 200);
    const e = data.entry, ex = +(Q.get('x') ?? e[0]), ey = +(Q.get('y') ?? e[1]);
    const yaw = (+(Q.get('yaw') ?? e[3])) * Math.PI / 180;   // GTA heading: 0 = +Y, 90 = -X
    cam.position.set(ex, 1.62, -ey);
    cam.lookAt(ex - Math.sin(yaw) * 5, 1.25, -(ey + Math.cos(yaw) * 5));
  } else {
    const az = (+(Q.get('az') || 45)) * Math.PI / 180, el = (+(Q.get('el') || 42)) * Math.PI / 180;
    const d = 60, dir = new THREE.Vector3(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az));
    // fit: project bbox corners
    const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), dir).normalize(), up = new THREE.Vector3().crossVectors(dir, right).normalize();
    let mnx = 1e9, mxx = -1e9, mny = 1e9, mxy = -1e9;
    for (const x of [bb[0], bb[3]]) for (const y of [bb[1], bb[4]]) for (const z of [0, H]) { const v = new THREE.Vector3(x - cx, z, -(y - cy)); const a = v.dot(right), b = v.dot(up); mnx = Math.min(mnx, a); mxx = Math.max(mxx, a); mny = Math.min(mny, b); mxy = Math.max(mxy, b); }
    const hw = (mxx - mnx) / 2 * 1.06, hh = (mxy - mny) / 2 * 1.06, s = Math.max(hw / aspect, hh);
    cam = new THREE.OrthographicCamera(-s * aspect, s * aspect, s, -s, 0.1, 300);
    const c = new THREE.Vector3(cx, 0, -cy).addScaledVector(right, (mnx + mxx) / 2).addScaledVector(up, (mny + mxy) / 2);
    cam.position.copy(c).addScaledVector(dir, d); cam.lookAt(c);
  }
  if (Q.get('clip')) renderer.clippingPlanes = [new THREE.Plane(new THREE.Vector3(0, -1, 0), +Q.get('clip'))];
  if (Q.get('ez')) { cam.position.y = +Q.get('ez'); const yw = (+(Q.get('yaw') || 0)) * Math.PI / 180; cam.lookAt(cam.position.x - Math.sin(yw) * 5, cam.position.y + (+(Q.get('pitch') || -0.4)), cam.position.z - Math.cos(yw) * 5); }
  renderer.render(scene, cam); window.__done = true;
})();
</script></body></html>
