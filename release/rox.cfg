# =====================================================================
#  ROX Store - full pack v2 | All rights reserved.
#  1) Copy "[rox]", "[ox]" and "[standalone]" into your server's resources folder.
#     [ox]/ox_inventory = official ox_inventory (GPL-3.0) with the ROX theme -> REPLACES your ox_inventory.
#  2) Put this file next to server.cfg and add:   exec rox.cfg
#     It must come AFTER: oxmysql, ox_lib, qbx_core, ox_target, pma-voice
# =====================================================================

# --- Steam names / IDs in the admin panel (steamcommunity.com/dev/apikey)
# set steam_webApiKey "YOUR_STEAM_WEB_API_KEY"

# --- Inventory: real models on the ground for dropped items
setr inventory:dropprops true
ensure ox_inventory

# --- Core UI (load first: other ROX scripts use them)
ensure rox_notify        # notifications
ensure rox_keyhints      # key prompt box (E / X ...)
ensure rox_interact      # choice list, prompts, keypad, quick heal (hold H)

# --- HUD & menus
ensure rox_hud           # status HUD, /cash /bank   (its old ESC menu is off: rox_pausemenu replaces it)
ensure rox_nexthud       # minimap frame, GPS card, compass, speedometer, money (Z)
ensure rox_weaponhud     # ammo counter + weapon icon (top right)
ensure rox_pausemenu     # next-gen ESC menu
ensure rox_settings      # settings menu + graphics looks (/settings)
ensure rox_graphics      # living world: wind in trees/grass, clouds, heavier rain
ensure rox_radialmenu    # F1 radial menu (police / EMS only)

# --- Weapons & items
ensure rox_weaponrules   # max 2 heavy + 2 light weapons, heavy weapons on your back
ensure rox_wheel         # weapon / item wheel (hold TAB)
ensure rox_inventory_3d  # 3D character inventory (F2)
ensure rox_consume       # bite-by-bite eating / drinking
ensure rox_gunstore      # gun stores (Ammu-Nation locations)
ensure rox_weapons       # new weapon models (after converting codewalker_xml, see its README)

# --- World / shops / vehicles
ensure rox_clothes       # clothing & body armor stores
ensure rox_mechanic      # auto care (performance upgrades, repair)
ensure rox_trunk         # next-gen trunk (E at the rear)
ensure rox_radio         # vehicle radio (hold Q in a vehicle)
ensure rox_streets       # tree / decor planter (/streets, admin)
ensure rox_maps          # ROX Diner + secret HQ (after converting codewalker_xml)

# --- Roleplay
ensure rox_emotes        # F5 emotes, walks, 10K animation library
ensure rox_bank          # bank branches
ensure rox_atm           # ATMs
ensure rox_police        # police iPad (on duty)
ensure rox_realestate    # real estate iPad (/ipad, F6)
ensure rox_phone         # ROX phone (M)
ensure rox_admin         # admin console (/admin, F10)

# --- Optional 3D map (GPL-3.0, separate resource)
ensure zerodream_3dmap

# --- Permissions
# add_ace identifier.license:YOUR_LICENSE rox.owner allow
# add_ace group.admin rox.streets allow
# add_ace group.admin rox_realestate.realtor allow

# --- KEY CONFLICTS to decide (players can rebind in GTA Settings > Key Bindings > FiveM):
#  TAB : rox_wheel  vs ox_inventory hotbar           -> change Config.Key in rox_wheel/config.lua if you keep the hotbar
#  F2  : rox_inventory_3d vs ox_inventory open key    -> pick one inventory as the main one
#  F1  : rox_radialmenu vs zerodream_3dmap            -> change Config.Key in rox_radialmenu/config.lua
