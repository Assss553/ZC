<!DOCTYPE html>
<!-- ROX Store | rox_hud V2 | All rights reserved. -->
<html lang="en"><head><meta charset="UTF-8"><title>ROX HUD</title>
<link rel="stylesheet" href="fa/css/fontawesome.min.css"><link rel="stylesheet" href="fa/css/solid.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Rajdhani:wght@600;700&family=Barlow+Condensed:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body>
<div id="hud" class="hud">
    <div id="compass" class="compass"><div class="strip" id="strip"></div><div class="needle"></div>
        <div class="loc"><span class="dir" id="dir">N</span><span class="street" id="street"></span><span class="zone" id="zone"></span></div></div>

    <!-- status (bottom right) -->
    <div class="status">
        <div class="hp-row"><i class="fa-solid fa-heart heart" id="heart"></i>
            <div class="hp-wrap"><div class="ar-line" id="arLine"></div><div class="segs" id="hpSegs"></div><div class="base"></div></div>
            <b class="hp-num" id="hpVal">100</b></div>
        <div class="dia-row"><div class="voice" id="voice"><i class="fa-solid fa-microphone"></i><span id="vTxt">Normal</span></div><div class="dias" id="dias"></div></div>
    </div>

    <!-- vehicle (next to the minimap) -->
    <div id="veh" class="veh">
        <div class="v-top"><div class="spd" id="spd"><span class="dim">00</span>0</div><span class="unit" id="unit">KM/H</span><div class="gear" id="gear">N</div></div>
        <div class="rpm" id="rpm"></div>
        <div class="fuel-row"><i class="fa-solid fa-gas-pump"></i><div class="fsegs" id="fuel"></div><b id="fuelTxt">100%</b></div>
        <div class="chips"><span class="chip" id="cBelt"><i class="fa-solid fa-user-shield"></i>BELT</span><span class="chip" id="cEng"><i class="fa-solid fa-gear"></i>ENG</span>
            <span class="chip" id="cLgt"><i class="fa-solid fa-lightbulb"></i>LIGHTS</span><span class="chip" id="cLock"><i class="fa-solid fa-lock"></i>LOCK</span></div>
    </div>
</div>
<script src="app.js"></script></body></html>
