<!DOCTYPE html>
<!-- ROX Store | rox_hud V3 | All rights reserved. -->
<html lang="en"><head><meta charset="UTF-8"><title>ROX HUD</title>
<link rel="stylesheet" href="fa/css/fontawesome.min.css"><link rel="stylesheet" href="fa/css/solid.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Rajdhani:wght@600;700&family=Barlow+Condensed:ital,wght@1,600;1,700;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body>
<div id="vignette" class="vignette"></div>
<div id="hud" class="hud">

    <!-- compass -->
    <div id="compass" class="compass"><div class="strip" id="strip"></div><div class="marker"><b id="deg">0</b></div></div>

    <!-- player info -->
    <div id="info" class="info">
        <div class="i-top"><span class="logo">ROX</span><span class="pill"><i class="fa-solid fa-id-badge"></i>ID <b id="pid">0</b></span><span class="pill"><i class="fa-solid fa-clock"></i><b id="ptime">00:00</b></span></div>
        <div class="i-job" id="pjob"><i class="fa-solid fa-briefcase"></i><span id="pjobTxt">Unemployed</span><i class="dot" id="pduty"></i></div>
        <div class="i-money"><span class="cash"><i class="fa-solid fa-money-bill-wave"></i><b id="pcash">$0</b></span><span class="bank"><i class="fa-solid fa-building-columns"></i><b id="pbank">$0</b></span></div>
    </div>

    <!-- minimap: header + frame + hex status -->
    <div id="mapFrame" class="map-frame"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i></div>
    <div id="mapHead" class="map-head"><span class="hex acc"><i class="fa-solid fa-map-location-dot"></i></span>
        <div class="mh-bar"><b id="street">—</b><span id="zone">—</span></div><span class="hex"><b id="dir">N</b></span></div>
    <div id="hexRow" class="hex-row"></div>

    <!-- vehicle (next to the minimap) -->
    <div id="veh" class="veh">
        <div class="v-side"><span class="hex sm" id="hFuel"><i class="fa-solid fa-gas-pump"></i></span><span class="hex sm" id="hEng"><i class="fa-solid fa-oil-can"></i></span></div>
        <div class="v-main">
            <div class="v-top"><span class="unit" id="unit">KM/H</span></div>
            <div class="v-spd"><div class="spd" id="spd"><span class="dim">00</span>0</div><span class="hex gear" id="gear"><b>N</b></span></div>
            <div class="rpm" id="rpm"></div>
            <div class="fuel-row"><div class="fsegs" id="fuel"></div><b id="fuelTxt">100%</b></div>
            <div class="chips"><span class="chip" id="cBelt"><i class="fa-solid fa-user-shield"></i>BELT</span><span class="chip" id="cEng"><i class="fa-solid fa-gear"></i>ENG</span><span class="chip" id="cLgt"><i class="fa-solid fa-lightbulb"></i>LIGHTS</span><span class="chip" id="cLock"><i class="fa-solid fa-lock"></i>LOCK</span></div>
        </div>
    </div>

    <!-- health (bottom right) -->
    <div class="health">
        <div class="h-row"><i class="fa-solid fa-heart heart" id="heart"></i>
            <div class="h-wrap"><div class="ar-line" id="arLine"></div><div class="segs" id="hpSegs"></div><div class="base"></div></div><b class="h-num" id="hpVal">100</b></div>
        <div class="h-sub"><span class="voice" id="voice"><i class="fa-solid fa-microphone"></i><span id="vTxt">Normal</span></span><span class="armor-num" id="arTxt"><i class="fa-solid fa-shield-halved"></i><b id="arVal">0</b></span></div>
    </div>
</div>

<!-- /hud settings -->
<div id="settings" class="settings"><div class="s-card">
    <div class="s-head"><span class="logo">ROX</span><div><b>HUD Settings</b><small>Saved on your PC</small></div><button class="s-x" data-a="close"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="s-list" id="sList"></div>
    <div class="s-sec">Accent colour</div><div class="swatches" id="swatches"></div>
    <div class="s-sec">Speed unit</div><div class="seg" id="unitSeg"><button data-u="kmh">KM/H</button><button data-u="mph">MPH</button></div>
    <button class="s-done" data-a="close">Done</button>
</div></div>
<script src="app.js"></script></body></html>
