# نشر بضغطة على Render (مجاني) — الخادم يتصل بقاعدة PostgreSQL مجانية على Neon
services:
  - type: web
    name: rox
    runtime: node
    plan: free
    region: frankfurt            # أقرب منطقة للسعودية
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL         # رابط قاعدة Neon (postgresql://...)
        sync: false
      - key: SETUP_TOKEN          # رمز إنشاء أول أدمن — تلقاه في Environment
        generateValue: true
      - key: ANTHROPIC_API_KEY    # مفتاح Claude لاستوديو الذكاء الاصطناعي
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
