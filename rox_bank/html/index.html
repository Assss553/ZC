<div id="bank"><div class="stage" id="stage"><div class="shell">

  <section class="main">

    <div class="hero">

        <div class="row"><div class="chipx"><svg class="i"><use href="#i-bank" color="#ff9a5c"/></svg>Bank <b id="bal2">$0</b></div><div class="chipx"><svg class="i"><use href="#i-cash"/></svg>Cash <b id="cash">$0</b></div></div>

      <div class="ac" style="--c:#ff7a3d" data-v="withdraw"><div class="ib"><svg class="i"><use href="#i-wd"/></svg></div><div><b>Withdraw</b><small>Account to cash</small></div></div>

<div class="toast" id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const PREVIEW = !window.invokeNative;
const post = (n, d = {}) => PREVIEW ? Promise.resolve(mock(n, d)) : fetch(`https://${GetParentResourceName()}/${n}`, { method: 'POST', body: JSON.stringify(d) }).then(r => r.json()).catch(() => null);
const m = (n) => '$' + Math.floor(n || 0).toLocaleString('en-US');
const ic = (id, extra = '') => `<svg class="i" ${extra}><use href="#i-${id}"/></svg>`;
let S = {}, view = 'deposit', flt = 'all', busy = false, val = '';
const V = { deposit: ['Deposit', 'dep', '#2ee59d', 'Put cash into your account'], withdraw: ['Withdraw', 'wd', '#ff7a3d', 'Take cash out of your account'], transfer: ['Transfer', 'tr', '#5aa7ff', 'Send money to another person'] };
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('on'), 2400); }
function count(el, to, big) { const from = +(el.dataset.v || 0); el.dataset.v = to; const t0 = performance.now(); const f = (t) => { const p = Math.min(1, (t - t0) / 800), e = 1 - Math.pow(1 - p, 4), v = Math.floor(from + (to - from) * e).toLocaleString('en-US'); el.innerHTML = big ? `<span>$</span>${v}` : '$' + v; if (p < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); }
function area() { const tx = (S.tx || []).slice(0, 14).reverse(); let pts = tx.map(t => t.balance); if (pts.length < 2) pts = [S.bank * .9, S.bank]; const mx = Math.max(...pts), mn = Math.min(...pts), r = mx - mn || 1;
  const xy = pts.map((v, i) => [i / (pts.length - 1) * 400, 85 - (v - mn) / r * 60]); const d = xy.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  $('area').innerHTML = `<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a1f" stop-opacity=".35"/><stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/></linearGradient></defs><path d="${d} L400 95 L0 95Z" fill="url(#ag)"/><path d="${d}" fill="none" stroke="#ff7a3d" stroke-width="2.5"/>`; }
function fill() { const n = S.name || ''; $('nm').textContent = n; $('holder').textContent = n.toUpperCase(); $('av').textContent = n.split(' ').map(w => w[0]).join('').slice(0, 2); $('jb').textContent = S.job || 'Citizen';
  const h = new Date().getHours(); $('hi').textContent = `${h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'}, ${n.split(' ')[0]}`;
  $('dt').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }); $('branch').textContent = S.branch || 'ROX Bank';
  const acc = String(S.account || '0000').replace(/\W/g, '').padStart(4, '0'); $('no').textContent = '•••• •••• •••• ' + acc.slice(-4);
  count($('bal'), S.bank, true); count($('bal2'), S.bank); count($('cash'), S.cash); area(); list(); }
function list() { const L = (S.tx || []).filter(t => flt === 'all' || t.kind === flt);
  $('list').innerHTML = L.length ? L.map((t, i) => `<div class="tx ${t.kind}" style="animation-delay:${Math.min(i, 12) * 40}ms"><div class="ti" style="background:${t.kind === 'in' ? 'rgba(46,229,157,.1)' : 'rgba(255,90,31,.1)'}">${ic(/deposit/i.test(t.label) ? 'dep' : /withdraw/i.test(t.label) ? 'wd' : t.kind === 'in' ? 'in' : 'tr')}</div>
    <div><b>${t.label}</b><small>${new Date(t.at * 1000).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}</small></div><span class="st">COMPLETED</span><div class="v">${t.kind === 'in' ? '+' : '−'}${m(t.amount)}<small style="color:var(--tx2)">Bal. ${m(t.balance)}</small></div></div>`).join('')
    : `<div class="empty"><div>${ic('receipt', 'style="color:#ff9a5c"')}No activity yet</div></div>`; }
function nav(v) { document.querySelectorAll('.rb').forEach((r, i) => r.classList.toggle('on', i > 0 && r.dataset.v === v)); document.querySelectorAll('.ac').forEach(a => a.classList.toggle('on', a.dataset.v === v)); }
function panel(v) { view = v; val = ''; nav(v); const s = $('side');
  if (v === 'stats') { const wk = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - 6 + i); const k = d.toDateString(); const tx = (S.tx || []).filter(t => new Date(t.at * 1000).toDateString() === k);
      return { d: d.toLocaleDateString('en-US', { weekday: 'short' }), i: tx.filter(t => t.kind === 'in').reduce((a, t) => a + t.amount, 0), o: tx.filter(t => t.kind === 'out').reduce((a, t) => a + t.amount, 0) }; });
    const mx = Math.max(1, ...wk.map(w => Math.max(w.i, w.o))), ti = wk.reduce((a, w) => a + w.i, 0), to = wk.reduce((a, w) => a + w.o, 0);
    s.classList.remove('tr'); s.style.setProperty('--c', '#a98bff'); s.innerHTML = `<div class="sh"><div class="ib">${ic('st')}</div><div><b>Insights</b><small>Your last 7 days</small></div></div>
      <div class="kpi"><div><small>INCOME</small><b style="color:var(--g)">${m(ti)}</b></div><div><small>SPENT</small><b style="color:var(--a2)">${m(to)}</b></div><div class="w"><small>NET FLOW</small><b>${ti - to >= 0 ? '+' : '−'}${m(Math.abs(ti - to))}</b></div></div>
      <div class="chart">${wk.map((w, k) => `<div><i class="in" style="height:${Math.max(2, w.i / mx * 100)}%;animation-delay:${k * 60}ms"></i><i class="out" style="height:${Math.max(2, w.o / mx * 100)}%;animation-delay:${k * 60 + 30}ms"></i><span>${w.d}</span></div>`).join('')}</div>`; return; }
  const [t, icon, c, sub] = V[v]; s.style.setProperty('--c', c); s.classList.toggle('tr', v === 'transfer');
  s.innerHTML = `<div class="sh"><div class="ib">${ic(icon)}</div><div><b>${t}</b><small>${sub}</small></div></div>
    ${v === 'transfer' ? `<div class="fld">${ic('user')}<input id="to" placeholder="Phone, account or citizen ID"></div><div class="fld">${ic('note')}<input id="note" maxlength="60" placeholder="Note (optional)"></div>` : ''}
    <div class="amt" id="amtBox"><div class="v z" id="amt"><span>$</span>0</div><div class="after">${v === 'deposit' ? 'Cash' : 'Balance'} ${m(v === 'deposit' ? S.cash : S.bank)} · after <b id="aft">—</b></div></div>
    <div class="qk">${[100, 1000, 5000].map(x => `<b data-q="${x}">${m(x)}</b>`).join('')}<b data-q="max">MAX</b></div>
    <div class="pad">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '00', '0', 'del'].map(k => `<b data-k="${k}">${k === 'del' ? ic('del') : k}</b>`).join('')}</div>
    <div class="err" id="err"></div><button class="go ${v === 'deposit' ? 'dark' : ''}" id="go">${ic(icon, v === 'deposit' ? 'style="filter:brightness(.2)"' : 'style="filter:brightness(10)"')}${t}</button>
    <div class="done" id="done"><div class="ok">${ic('check')}</div><b id="dT"></b><p id="dS"></p><div class="rc" id="rc"></div><button id="dB">Done</button></div>`;
  const src = () => v === 'deposit' ? S.cash : S.bank;
  const draw = () => { const n = +val || 0; $('amt').innerHTML = `<span>$</span>${n.toLocaleString('en-US')}`; $('amt').classList.toggle('z', !n); $('aft').textContent = n ? m(v === 'deposit' ? S.bank + n : S.bank - n) : '—';
    const bad = n > src(); $('amtBox').classList.toggle('bad', bad); $('err').textContent = bad ? 'Not enough money' : ''; };
  s.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const k = b.dataset.k; val = k === 'del' ? val.slice(0, -1) : (val + k).replace(/^0+/, '').slice(0, 9); draw(); });
  s.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { val = String(b.dataset.q === 'max' ? Math.floor(src()) : b.dataset.q); draw(); });
  s.querySelectorAll('input').forEach(i => i.onkeydown = (e) => e.stopPropagation());
  $('go').onclick = async () => { const n = +val || 0; if (busy) return; if (!n) return $('err').textContent = 'Enter an amount'; if (n > src()) return; const to = v === 'transfer' ? $('to').value.trim() : '';
    if (v === 'transfer' && !to) return $('err').textContent = 'Who do you want to send to?';
    busy = true; $('go').disabled = true; const r = await post('action', { action: v, amount: n, to, note: v === 'transfer' ? $('note').value : undefined }); busy = false; $('go').disabled = false;
    if (!r || !r.ok) return $('err').textContent = (r && r.msg) || 'Something went wrong';
    Object.assign(S, r); fill(); $('dT').textContent = m(n); $('dS').textContent = v === 'deposit' ? 'Deposited to your account' : v === 'withdraw' ? 'Withdrawn as cash' : 'Sent to ' + to;
    $('rc').innerHTML = `<div>Type<b>${t}</b></div><div>Reference<b>RB-${(Date.now() % 1e7).toString().padStart(7, '0')}</b></div><div>New balance<b>${m(S.bank)}</b></div>`; $('done').classList.add('on'); };
  $('dB').onclick = () => panel(v); draw(); }
document.addEventListener('keydown', (e) => { if (!$('bank').classList.contains('on') || e.target.tagName === 'INPUT') return; const b = document.querySelector(`.pad [data-k="${/^\d$/.test(e.key) ? e.key : e.key === 'Backspace' ? 'del' : 'x'}"]`); if (b) b.click(); if (e.key === 'Enter' && $('go')) $('go').click(); });
document.querySelector('.rail').addEventListener('click', (e) => { const r = e.target.closest('[data-v]'); if (r) panel(r.dataset.v); });
document.querySelector('.acts').addEventListener('click', (e) => { const r = e.target.closest('[data-v]'); if (r) panel(r.dataset.v); });
$('flt').onclick = (e) => { const b = e.target.closest('[data-f]'); if (!b) return; flt = b.dataset.f; [...$('flt').children].forEach(x => x.classList.toggle('on', x === b)); list(); };
$('cc').onclick = () => toast('Account: ' + (S.account || ''));
/* 3D: the whole bank leans toward the mouse, the card follows more */
document.addEventListener('mousemove', (e) => { if (!$('bank').classList.contains('on')) return; const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
  $('stage').style.transform = `rotateY(${x * 12}deg) rotateX(${-y * 9}deg)`; $('glare').style.setProperty('--gx', (x + .5) * 100 + '%'); $('glare').style.setProperty('--gy', (y + .5) * 100 + '%');
  $('cc').style.transform = `rotateY(${x * 18}deg) rotateX(${-y * 14}deg)`; $('cc').style.setProperty('--hx', (x * 160) + '%'); });
document.addEventListener('mouseleave', () => { $('stage').style.transform = ''; $('cc').style.transform = ''; });
function close() { $('bank').classList.remove('on'); post('close'); }
$('exit').onclick = close; document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('bank').classList.contains('on')) close(); });
window.addEventListener('message', (e) => { const d = e.data; if (d?.action !== 'open') return; S = d.data; ['bal', 'bal2', 'cash'].forEach(k => $(k).dataset.v = 0); $('bank').classList.add('on'); fill(); panel('deposit'); });
function mock(n, d) { if (n !== 'action') return 1; const s = { ...S, tx: [...S.tx] }; const t = Math.floor(Date.now() / 1000);
  if (d.action === 'deposit') { s.cash -= d.amount; s.bank += d.amount; s.tx.unshift({ kind: 'in', label: 'Cash deposit', amount: d.amount, balance: s.bank, at: t }); }
  if (d.action === 'withdraw') { s.cash += d.amount; s.bank -= d.amount; s.tx.unshift({ kind: 'out', label: 'Cash withdrawal', amount: d.amount, balance: s.bank, at: t }); }
  if (d.action === 'transfer') { s.bank -= d.amount; s.tx.unshift({ kind: 'out', label: 'To ' + d.to, amount: d.amount, balance: s.bank, at: t }); } s.ok = true; return s; }
if (PREVIEW) { document.body.classList.add('preview'); const t = Math.floor(Date.now() / 1000);
  window.postMessage({ action: 'open', data: { name: 'Preview Player', cid: 'ABC12345', account: 'US0ROX4821', job: 'LSPD · Sergeant', cash: 4250, bank: 62881, branch: 'Fleeca · Legion Square',
    tx: [{ kind: 'in', label: 'Cash deposit', amount: 1500, balance: 62881, at: t - 3600 }, { kind: 'out', label: 'To Sara K · Rent', amount: 800, balance: 61381, at: t - 90000 }, { kind: 'in', label: 'From Abu Snow', amount: 2500, balance: 62181, at: t - 180000 },
      { kind: 'out', label: 'Cash withdrawal', amount: 300, balance: 59681, at: t - 260000 }, { kind: 'in', label: 'Paycheck · LSPD', amount: 3200, balance: 59981, at: t - 340000 }, { kind: 'out', label: 'To Mechanic Shop', amount: 950, balance: 56781, at: t - 420000 }] } }, '*'); }
</script></body></html>
