<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ZC Radial</title>
    <link rel="stylesheet" href="fa/css/fontawesome.min.css">
    <link rel="stylesheet" href="fa/css/solid.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <svg width="0" height="0" style="position:absolute"><defs id="defs">
        <linearGradient id="gArc" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
            <stop offset="50%" stop-color="var(--accent)"/>
            <stop offset="100%" stop-color="#fff" stop-opacity="0.9"/>
        </linearGradient>
    </defs></svg>

    <div id="stage" class="stage">
        <canvas id="fx" class="fx"></canvas>
        <div id="wheel" class="wheel">
            <div class="layer floor"></div>

            <svg class="layer deco deco-a" viewBox="0 0 1000 1000">
                <circle cx="500" cy="500" r="404" class="tick-ring"/>
            </svg>
            <svg class="layer deco deco-b" viewBox="0 0 1000 1000">
                <circle cx="500" cy="500" r="223" class="dash-ring"/>
                <circle cx="500" cy="500" r="232" class="thin-ring"/>
            </svg>
            <svg class="layer base" viewBox="0 0 1000 1000">
                <circle cx="500" cy="500" r="173" class="base-ring"/>
            </svg>

            <div id="rings" class="layer"></div>

            <svg id="arcLayer" class="layer arc-layer" viewBox="0 0 1000 1000"><path id="activeArcGlow" class="active-arc glow"/><path id="activeArc" class="active-arc"/></svg>
            <svg id="needleLayer" class="layer needle-layer" viewBox="0 0 1000 1000"><path d="M500 382 l-8 -12 h16 z" class="needle"/></svg>

            <div class="core">
                <div class="core-shadow"></div>
                <div class="core-ring"></div>
                <div class="core-edge"></div>
                <div class="core-glass"><i id="mark" class="mark fa-solid fa-circle"></i><div class="scan"></div></div>
            </div>
            <div class="layer core-text">
                <div id="crumb" class="crumb">ZC MENU</div>
                <div id="label" class="label">ZC MENU</div>
                <div id="hint" class="hint"></div>
                <button id="closeBtn" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>

        <div class="hud">
            <div id="chips" class="chips"></div>
            <div class="keys">
                <span><b>LMB</b> select</span>
                <span><b>SCROLL</b> navigate</span>
                <span><b>RMB</b> / <b>ESC</b> close</span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
