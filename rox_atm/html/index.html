<style>

#atm.on { display: flex; animation: fade .3s; } @keyframes fade { from { opacity: 0; } }
/* machine */
.mach { position: relative; width: 760px; height: 640px; transform-style: preserve-3d; transition: transform .3s cubic-bezier(.2,.8,.3,1); animation: rise .6s cubic-bezier(.16,1,.3,1); }
@keyframes rise { from { transform: translateY(60px) rotateX(25deg) scale(.9); opacity: 0; } }
.body { position: absolute; inset: 0; border-radius: 34px; padding: 26px; display: grid; grid-template-columns: 1fr 170px; grid-template-rows: auto 1fr auto; gap: 18px;

.body::before { content: ''; position: absolute; inset: 0; border-radius: 34px; pointer-events: none; background: repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 1px, transparent 1px 4px); }
.glare { position: absolute; inset: 0; border-radius: 34px; pointer-events: none; z-index: 9; background: radial-gradient(420px circle at var(--gx, 50%) var(--gy, 0%), rgba(255,255,255,.08), transparent 60%); transform: translateZ(70px); }
.brand { grid-column: span 2; display: flex; align-items: center; gap: 12px; padding: 4px 6px; transform: translateZ(15px); } .brand .lg { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font-size: 21px; background: linear-gradient(145deg, #ff8a4c, #c43a0a); box-shadow: 0 8px 20px rgba(255,90,31,.5); }
.brand b { font-size: 17px; font-weight: 800; letter-spacing: 1.5px; } .brand small { display: block; font-size: 10.5px; color: var(--tx2); letter-spacing: 0; font-weight: 600; } .brand .sp { flex: 1; }
.brand .led { display: flex; align-items: center; gap: 7px; font-size: 10.5px; font-weight: 800; color: var(--g); letter-spacing: 1px; } .brand .led i { width: 8px; height: 8px; border-radius: 50%; background: var(--g); box-shadow: 0 0 10px var(--g); animation: bl 2s infinite; } @keyframes bl { 50% { opacity: .4; } }
.x { width: 36px; height: 36px; border-radius: 11px; border: 0; background: rgba(255,255,255,.07); color: #fff; cursor: pointer; font-size: 18px; display: grid; place-items: center; } .x:hover { background: var(--r); }
/* screen */
.screen { position: relative; border-radius: 22px; padding: 6px; background: #050506; box-shadow: inset 0 0 0 2px #000, inset 0 0 30px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.08); transform: translateZ(10px); }

.disp::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(115deg, rgba(255,255,255,.06), transparent 35%), repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 1px, transparent 1px 3px); }
.pg { position: absolute; inset: 22px; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transform: translateX(30px); transition: .35s cubic-bezier(.2,.8,.3,1); } .pg.on { opacity: 1; pointer-events: auto; transform: none; }
.pg h2 { font-size: 24px; font-weight: 800; letter-spacing: -.5px; } .pg p.s { font-size: 12.5px; color: var(--tx2); margin-top: 3px; }

.ccard { width: 190px; height: 120px; border-radius: 14px; background: linear-gradient(135deg, #ff7f3f, #d23e08 55%, #6a1803); box-shadow: 0 16px 30px rgba(255,90,31,.35); position: relative; animation: insert 2.2s cubic-bezier(.6,0,.3,1) infinite; }
.ccard::before { content: ''; position: absolute; left: 16px; top: 34px; width: 34px; height: 26px; border-radius: 6px; background: linear-gradient(135deg, #fff1b8, #c69a2e); } .ccard::after { content: 'ROX'; position: absolute; right: 14px; top: 12px; font: 800 13px 'Plus Jakarta Sans'; letter-spacing: 1px; }
@keyframes insert { 0% { transform: translateY(40px); opacity: 0; } 30% { opacity: 1; } 70% { transform: translateY(-30px); opacity: 1; } 100% { transform: translateY(-70px) scaleY(.4); opacity: 0; } }
.ins b { font-size: 20px; } .ins small { color: var(--tx2); font-size: 12.5px; } .ins .go { width: 220px; }
.dots { display: flex; gap: 6px; } .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--a); animation: dt 1s infinite; } .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; } @keyframes dt { 50% { opacity: .2; transform: scale(.6); } }

.opt .ib { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 28px; flex: none; background: linear-gradient(145deg, color-mix(in srgb, var(--c) 30%, transparent), color-mix(in srgb, var(--c) 6%, transparent)); box-shadow: 0 10px 22px color-mix(in srgb, var(--c) 25%, transparent); }
.opt b { display: block; font-size: 15px; } .opt small { font-size: 11px; color: var(--tx2); } .opt kbd { margin-left: auto; font: 800 10px 'JetBrains Mono'; padding: 4px 7px; border-radius: 6px; background: rgba(255,255,255,.08); color: var(--tx2); }

.back { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--tx2); cursor: pointer; width: fit-content; margin-bottom: 8px; } .back:hover { color: #fff; } .back svg { font-size: 16px; }

.go { margin-top: auto; height: 54px; border-radius: 16px; border: 0; color: #fff; font: 800 15px 'Plus Jakarta Sans'; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; position: relative; overflow: hidden;

.side { display: flex; flex-direction: column; gap: 12px; transform: translateZ(25px); }

        <div class="opt" style="--c:#2ee59d" data-k="deposit"><div class="ib"><svg class="i"><use href="#i-dep"/></svg></div><div><b>Deposit</b><small>Put cash in</small></div><kbd>2</kbd></div>
        <div class="opt" style="--c:#a98bff" data-k="fast"><div class="ib"><svg class="i"><use href="#i-fast"/></svg></div><div><b>Fast cash</b><small id="fastS">$500 now</small></div><kbd>3</kbd></div>
        <div class="opt" style="--c:#5aa7ff" data-k="receipt"><div class="ib"><svg class="i"><use href="#i-rcpt"/></svg></div><div><b>Balance</b><small>Print receipt</small></div><kbd>4</kbd></div></div></div>
    <div class="pg" id="pAmt"><div class="back" data-back><svg class="i"><use href="#i-back"/></svg>Back</div><h2 id="aT">Withdraw</h2><p class="s" id="aS">Choose or type an amount</p>
      <div class="amt" id="amtBox"><div class="v z" id="amt"><span>$</span>0</div><div class="s2" id="aAv"></div></div><div class="qk" id="quick"></div><div class="err" id="err"></div>
      <button class="go" id="go"></button></div>
    <div class="pg" id="pOk"><div class="ok"><div class="c"><svg class="i"><use href="#i-check"/></svg></div><b id="oV">$0</b><p id="oS"></p><div class="row"><button data-back>Another transaction</button><button class="p" id="fin">Finish</button></div></div></div>
  </div></div>
  <div class="side"><div class="slot" id="slot"><i></i>CARD</div><div class="keys" id="keys"></div></div>
  <div class="disp2" id="dsp"><div class="mouth"></div><small>CASH</small></div>
</div><div class="glare" id="glare"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const PREVIEW = !window.invokeNative;
const RES = window.GetParentResourceName ? GetParentResourceName() : 'rox_atm';
const post = (n, d = {}) => PREVIEW ? Promise.resolve(n === 'tx' ? mock(d) : 1) : fetch(`https://${RES}/${n}`, { method: 'POST', body: JSON.stringify(d) }).then(r => r.json()).catch(() => null);
const m = (n) => { n = Math.floor(n || 0); const a = Math.abs(n); return a >= 1e12 ? '$' + (n / 1e12).toFixed(1) + 'T' : a >= 1e9 ? '$' + (n / 1e9).toFixed(1) + 'B' : '$' + n.toLocaleString('en-US'); };
let S = {}, kind = 'withdraw', val = '', busy = false, page = 'pIns';
function go(p) { page = p; document.querySelectorAll('.pg').forEach(x => x.classList.toggle('on', x.id === p)); }
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('on'), 2200); }
function count(el, to) { const from = +(el.dataset.v || 0); el.dataset.v = to; const t0 = performance.now(); const f = (t) => { const p = Math.min(1, (t - t0) / 700), e = 1 - Math.pow(1 - p, 4); el.textContent = m(from + (to - from) * e); if (p < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); }
function bal() { count($('bank'), S.bank); count($('cash'), S.cash); }
function amtPage(k) { kind = k; val = ''; const c = k === 'withdraw' ? '#ff7a3d' : '#2ee59d'; $('pAmt').style.setProperty('--c', c);
  $('aT').textContent = k === 'withdraw' ? 'Withdraw cash' : 'Deposit cash'; $('quick').innerHTML = (S.quick || [100, 500, 1000, 2000, 5000, 10000]).map(v => `<b data-q="${v}">${m(v)}</b>`).join('');
  $('go').className = 'go' + (k === 'deposit' ? ' dark' : ''); $('go').innerHTML = `<svg class="i"><use href="#i-${k === 'withdraw' ? 'wd' : 'dep'}"/></svg>${k === 'withdraw' ? 'Withdraw' : 'Deposit'}`; draw(); go('pAmt'); }
const src = () => kind === 'withdraw' ? S.bank : S.cash;
function draw() { const n = +val || 0; $('amt').innerHTML = `<span>$</span>${n.toLocaleString('en-US')}`; $('amt').classList.toggle('z', !n); const bad = n > src();
  $('amtBox').classList.toggle('bad', bad); $('err').textContent = bad ? (kind === 'withdraw' ? 'Not enough money in your account' : 'Not enough cash') : '';
  $('aAv').innerHTML = `${kind === 'withdraw' ? 'Available' : 'Cash on you'} <b>${m(src())}</b>${n ? ` · after <b>${m(kind === 'withdraw' ? S.bank - n : S.bank + n)}</b>` : ''}`; }
async function send(k, n) { if (busy) return; if (!n) return $('err').textContent = 'Enter an amount'; if (n > (k === 'withdraw' ? S.bank : S.cash)) return draw();
  busy = true; $('go').disabled = true; const r = await post('tx', { kind: k, amount: n }); busy = false; $('go').disabled = false;
  if (!r || !r.ok) { $('err').textContent = (r && r.msg) || 'Transaction failed'; return go(page === 'pMenu' ? 'pAmt' : page); }
  S.cash = r.cash; S.bank = r.bank; bal(); $('oV').textContent = m(n); $('oS').textContent = k === 'withdraw' ? 'Take your cash below' : 'Deposited to your account'; go('pOk'); if (k === 'withdraw') bills(n); }
function bills(n) { const c = Math.min(6, Math.max(2, Math.ceil(n / 1000))); for (let i = 0; i < c; i++) setTimeout(() => { const b = document.createElement('div'); b.className = 'bill'; b.textContent = '$'; b.style.setProperty('--y', 50 + i * 6 + 'px'); b.style.setProperty('--r', (Math.random() * 16 - 8) + 'deg'); $('dsp').appendChild(b); setTimeout(() => b.remove(), 1500); }, i * 140); }
document.querySelector('.opts').onclick = (e) => { const o = e.target.closest('[data-k]'); if (!o) return; const k = o.dataset.k;
  if (k === 'fast') return send('withdraw', Math.min(500, Math.floor(S.bank))); if (k === 'receipt') { toast(`Balance: ${m(S.bank)} · Cash: ${m(S.cash)}`); return; } amtPage(k); };
$('quick').onclick = (e) => { const b = e.target.closest('[data-q]'); if (b) { val = b.dataset.q; draw(); } };
$('go').onclick = () => send(kind, +val || 0); $('fin').onclick = close;
document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => { $('err').textContent = ''; go('pMenu'); });
// physical keypad
const K = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', 'E']; $('keys').innerHTML = K.map(k => `<b data-k="${k}" class="${k === 'C' ? 'c' : k === 'E' ? 'e' : ''}">${k === 'C' ? '✕' : k === 'E' ? '✓' : k}</b>`).join('') + '<b data-k="D" class="d" style="grid-column:span 3">CLEAR</b>';
function key(k) { const b = $('keys').querySelector(`[data-k="${k}"]`); if (b) { b.classList.add('press'); setTimeout(() => b.classList.remove('press'), 120); }
  if (page === 'pMenu' && /[1-4]/.test(k)) return document.querySelectorAll('.opt')[+k - 1].click();
  if (page === 'pAmt') { if (/\d/.test(k)) val = (val + k).replace(/^0+/, '').slice(0, 8); else if (k === 'D') val = val.slice(0, -1); else if (k === 'C') return go('pMenu'); else if (k === 'E') return send(kind, +val || 0); draw(); }
  if (page === 'pOk' && k === 'E') close(); if (k === 'C' && page !== 'pAmt') close(); }
$('keys').onclick = (e) => { const b = e.target.closest('[data-k]'); if (b) key(b.dataset.k); };
document.addEventListener('keydown', (e) => { if (!$('atm').classList.contains('on')) return; if (e.key === 'Escape') return close(); if (/^\d$/.test(e.key)) key(e.key); if (e.key === 'Enter') key('E'); if (e.key === 'Backspace') key('D'); });
document.addEventListener('mousemove', (e) => { if (!$('atm').classList.contains('on')) return; const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
   $('glare').style.setProperty('--gx', (x + .5) * 100 + '%'); $('glare').style.setProperty('--gy', (y + .5) * 100 + '%'); });
function close() { $('atm').classList.remove('on'); post('close'); }
$('x').onclick = close;
window.addEventListener('message', (e) => { const d = e.data; if (d?.action !== 'open') return; S = d.data; $('title').textContent = d.data.title || 'ROX ATM'; $('street').textContent = d.data.street || '';
  $('hello').textContent = 'Hello, ' + String(S.name || '').trim().split(' ')[0]; $('bank').dataset.v = 0; $('cash').dataset.v = 0; $('slot').classList.remove('done');
  $('atm').classList.add('on'); go('pIns'); setTimeout(() => { $('slot').classList.add('done'); bal(); go('pMenu'); }, 1500); });
function mock(d) { const s = { ...S }; if (d.kind === 'withdraw') { s.bank -= d.amount; s.cash += d.amount; } else { s.cash -= d.amount; s.bank += d.amount; } s.ok = true; return s; }
if (PREVIEW) { document.body.classList.add('preview'); window.postMessage({ action: 'open', data: { street: 'Meteor St', name: 'Preview Character', cash: 4250, bank: 62881, quick: [100, 500, 1000, 2000, 5000, 10000] } }, '*'); }
</script></body></html>
