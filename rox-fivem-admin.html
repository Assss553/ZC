<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROX Store | لوحة التحكم</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' data: blob: https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'self'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 4 96 50 50 96 4 50Z' fill='%23e1281c'/%3E%3Cpath d='M31 31 69 69M69 31 31 69' stroke='%23000' stroke-width='9'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#efeae2;--sf:#fff;--fg:#14110f;--mu:#6b655e;--ln:#d5cec2;--red:#e1281c;--rt:#b81d12;--ok:#2f7a5b;--rad:0px;--eye:0;--dim:0;--zm:1;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0a09;--sf:#141211;--fg:#efeae2;--mu:#938d85;--ln:#2a2725;--rt:#ff5448;--ok:#4cc38a}}
:root[data-theme=dark]{--bg:#0b0a09;--sf:#141211;--fg:#efeae2;--mu:#938d85;--ln:#2a2725;--rt:#ff5448;--ok:#4cc38a}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Tajawal,system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.lat{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.02em;font-weight:400}
button,input,select,textarea{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:16px;height:16px}

/* الهيكل */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100svh}
.sd{display:none}
main{width:100%;min-width:0;max-width:1100px;margin-inline:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 18px 120px;zoom:var(--zm)}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.lg{font-size:34px;line-height:1;display:flex;align-items:center;gap:8px;direction:ltr}.lg b{color:var(--red);font-weight:400}.lg small{font-size:14px;color:var(--mu)}
.lg svg{width:.8em;height:.8em}
.tb{display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 14px;border:1px solid var(--ln);background:var(--sf);font-weight:700;text-decoration:none;border-radius:var(--rad)}
.tb:hover{border-color:var(--fg)}
.bar .sp{flex:1}
h1{font-size:clamp(30px,6vw,44px);font-weight:900;line-height:1.15;margin-bottom:18px}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;overflow-x:auto;scrollbar-width:none;background:var(--sf);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
#nv{display:flex;flex-direction:column;gap:4px}
.tabs .nb{flex:1 0 62px}
.nb{position:relative;isolation:isolate;padding:8px 2px 6px;font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mu);transition:color .25s}
.nb small{display:none}
.nb:before{content:"";position:absolute;inset:0;z-index:-1;background:var(--red);transform:skewX(-14deg);scale:0 1;transition:scale .35s cubic-bezier(.2,.8,.2,1);border-radius:var(--rad)}
.nb.on{color:#000}.nb.on:before{scale:1 1}
.nb em{position:absolute;top:2px;inset-inline-end:12px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#000;font:700 11px/18px Tajawal;font-style:normal;text-align:center;padding-inline:4px}
.nb.on em{background:#000;color:var(--red)}

/* نظرة عامة */
.hero{position:relative;overflow:hidden;background:var(--red);color:#000;padding:16px 20px 10px;border-radius:var(--rad)}
.hero:before{content:"";position:absolute;top:-20%;bottom:-20%;inset-inline-end:16%;width:9%;background:#0002;transform:skewX(-14deg)}
.hero>*{position:relative}
.hl{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.hl small{display:flex;align-items:center;gap:6px;font-size:14px}
.seg button{padding:5px 12px;font-weight:700;font-size:13px;border:1px solid #000;color:#000}.seg button.on{background:#000;color:var(--red)}
.num{font-size:clamp(84px,24vw,200px);line-height:.8;display:flex;align-items:baseline;gap:6px;direction:ltr;margin-top:10px}
.num i{font-style:normal;font-size:.45em}
.dl{font-weight:900;font-size:14px;margin-top:8px}
.hero svg.ch{display:block;width:100%;height:auto;margin-top:6px}.hero text{fill:#000;font:700 10px Tajawal}
.b{fill:#000;transform:skewX(-14deg);transform-box:fill-box;transform-origin:bottom;animation:gr .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--k)*.03s)}.b.t{fill:#fff}
@keyframes gr{from{scale:1 0}}
.na *{animation:none!important}
.ks{display:grid;grid-template-columns:1fr 1fr;gap:18px 0;margin:24px 0 2px}
.ks>div{position:relative;padding:2px 18px}
.ks>div:before{content:"";position:absolute;top:0;bottom:0;inset-inline-start:0;width:3px;background:var(--red);transform:skewX(-14deg)}
.ks small{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:13px}.ks small .i{color:var(--rt)}
.ks b{display:block;font-size:clamp(42px,9vw,62px);line-height:1;direction:ltr;text-align:right}.ks .tx{font:900 20px/1.4 Tajawal;direction:rtl}
.hh{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--mu);margin:28px 0 12px}
.hh:before{content:"";width:10px;height:18px;background:var(--red);transform:skewX(-14deg)}
.em{color:var(--mu);padding:12px 0}
.tp{display:grid;grid-template-columns:minmax(96px,170px) 1fr auto;gap:10px;align-items:center;margin-bottom:10px;font-size:14px}
.tp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp i{display:block;height:14px;width:var(--w);background:var(--red);transform:skewX(-14deg);transform-origin:right;animation:gx .8s cubic-bezier(.2,.8,.2,1) backwards}
.tp b{font-size:20px;direction:ltr}
@keyframes gx{from{scale:0 1}}
.cd{display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--ln);padding:14px 18px;border-radius:var(--rad)}.cd b{font-size:56px;line-height:1;color:var(--rt)}.cd .i{width:30px;height:30px;color:var(--rt)}

/* الطلبات */
.tk{display:grid;grid-template-columns:1fr auto;background:var(--sf);border:1px solid var(--ln);margin-bottom:10px;border-radius:var(--rad)}
.tk .in{display:block;width:100%;text-align:start;padding:12px 14px}.tk .in b{font-size:24px}.tk small{display:block;color:var(--mu);font-size:13px}
.cn{display:block;font-size:16px;margin-top:2px}
.sb{position:relative;border-inline-start:2px dashed var(--ln);padding:10px 14px;display:grid;gap:6px;justify-items:center;align-content:center;min-width:128px}
.sb:before,.sb:after{content:"";position:absolute;inset-inline-start:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg)}.sb:before{top:-8px}.sb:after{bottom:-8px}
.sb b{font-size:28px;line-height:1;direction:ltr}
.st{border:2px solid currentColor;padding:2px 10px;font-weight:900;font-size:13px;rotate:-5deg;transition:rotate .3s}.st:hover{rotate:0deg}
.s0{color:var(--rt)}.s1{color:var(--ok)}.s2{color:var(--mu)}
.dx{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--mu)}.dx:hover{color:var(--rt)}
.dm{font-style:normal;background:var(--fg);color:var(--bg);font-size:11px;padding:1px 7px;vertical-align:middle}
.fl{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.fl button{white-space:nowrap;border:1px solid var(--ln);background:var(--sf);padding:7px 14px;font-weight:700;font-size:14px;border-radius:var(--rad)}.fl button.on{background:var(--red);border-color:var(--red);color:#000}
.qw{position:relative;margin-bottom:10px}.qw .i{position:absolute;top:13px;inset-inline-start:13px;color:var(--mu)}
.q{width:100%;background:var(--sf);border:1px solid var(--ln);padding:11px 42px 11px 14px;color:var(--fg);border-radius:var(--rad)}
.hint{color:var(--mu);font-size:13px;margin-bottom:12px}

/* المنتجات */
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.pg>.mn,.pg>.hint{grid-column:1/-1}
.pt{background:var(--sf);border:1px solid var(--ln);display:flex;flex-direction:column;overflow:hidden;border-radius:var(--rad)}
.th{position:relative;aspect-ratio:1;display:grid;place-items:center;background:radial-gradient(90% 90% at 50% 115%,hsl(var(--h) 85% 45%/.9),transparent 70%),linear-gradient(180deg,hsl(var(--h) 35% 14%),hsl(var(--h) 45% 7%))}
.th svg{width:62%;filter:drop-shadow(0 10px 12px #0008);transition:transform .5s cubic-bezier(.2,.8,.2,1)}.pt:hover .th svg{transform:scale(1.1) rotate(-4deg)}
.th u{position:absolute;top:8px;inset-inline-start:8px;text-decoration:none;background:var(--red);color:#000;font-weight:900;font-size:11px;padding:1px 7px}
.pt>b{padding:10px 12px 0;font-size:15px}.pt>small{padding:0 12px;color:var(--mu);font-size:12px}
.pp{padding:2px 12px 10px;font-size:28px;line-height:1.1;color:var(--rt);direction:ltr;text-align:right}.pp s{font-size:15px;color:var(--mu);margin-inline-end:6px}
.ac{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ln);margin-top:auto}
.ac button{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;font-weight:700;font-size:13px}.ac button:hover{background:var(--fg);color:var(--bg)}.ac button:disabled{opacity:.35;pointer-events:none}
.pt.nw{border:2px dashed var(--ln);background:none;min-height:230px;display:grid;place-items:center;align-content:center;gap:8px;color:var(--mu);font-weight:700}.pt.nw:hover{color:var(--rt);border-color:var(--red)}
.pt.nw .i{width:30px;height:30px}

/* النماذج */
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 20px}.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
label{display:grid;gap:2px;font-size:13px;color:var(--mu);margin-bottom:14px}
input,select,textarea{background:none;border:0;border-bottom:2px solid var(--ln);padding:10px 2px;border-radius:0;min-width:0;color:var(--fg)}
input:focus,select:focus,textarea:focus{border-color:var(--red);outline:0}select option{background:var(--sf)}
input[type=range]{width:100%;accent-color:var(--red);border:0;padding:0}
input[type=color]{height:44px;padding:2px;border:1px solid var(--ln)}
.hu{display:flex;align-items:center;gap:10px}.hu i{flex:none;width:40px;height:40px;background:linear-gradient(160deg,hsl(var(--h) 70% 40%),hsl(var(--h) 50% 9%));border:1px solid var(--ln)}
.bt{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--ln);padding:11px 18px;font-weight:700;margin:6px 0 0 8px;border-radius:var(--rad)}.bt:hover{border-color:var(--fg)}.bt.p{background:var(--red);border-color:var(--red);color:#000}
.ov{position:fixed;inset:0;z-index:20;display:grid;align-items:end;justify-items:center;background:#000b;visibility:hidden;opacity:0;transition:opacity .3s,visibility 0s .3s}.ov.on{visibility:visible;opacity:1;transition-delay:0s}
.fb{background:var(--sf);border-top:4px solid var(--red);padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));width:min(100%,540px);max-height:92svh;overflow-y:auto;transform:translateY(30px);transition:transform .4s cubic-bezier(.2,.8,.2,1);border-radius:var(--rad) var(--rad) 0 0}.ov.on .fb{transform:none}
.fb h2{font-size:26px;font-weight:900;margin-bottom:14px}.er{color:var(--rt);display:block;min-height:1.4em}
.ir{display:grid;grid-template-columns:1fr 60px auto;gap:6px;align-items:center;margin-bottom:8px}.ir select,.ir input{border:1px solid var(--ln);padding:8px 6px;background:var(--sf)}.ir button{padding:8px 4px;color:var(--rt)}
#ts{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));translate:-50% 16px;background:var(--fg);color:var(--bg);padding:10px 18px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:30}#ts.on{opacity:1;translate:-50% 0}

/* القفل والصيانة */
#lk,#mp{position:fixed;inset:0;background:#000;color:#efeae2;display:grid;place-items:center;text-align:center;overflow:hidden;padding:24px}#lk{z-index:40}#mp{z-index:50}
#lk:before,#mp:before{content:"ROX";position:absolute;font:400 clamp(200px,62vw,640px)/.8 'Bebas Neue',Impact,sans-serif;color:transparent;-webkit-text-stroke:1px #1f1c1a;direction:ltr}
.lw{position:relative;display:grid;gap:12px;width:min(86vw,340px)}.lw .lg{font-size:54px;justify-content:center}.lw p{color:#938d85}.lw h2{font-size:34px;font-weight:900}
.lw .lki{width:44px;height:44px;margin:0 auto;color:var(--red)}
.lw input{text-align:center;font-size:17px;color:#efeae2;border-color:#2a2725}
.lw .dx{color:#938d85}
#go{background:var(--red);color:#000;font-weight:900;padding:13px}#go:disabled{opacity:.5}#le{color:#ff5448;min-height:1.4em}

/* الإعدادات والمظهر */
.mn{border:2px solid var(--red);padding:10px 14px;margin-bottom:14px;font-weight:700;color:var(--rt);display:flex;align-items:center;gap:8px}
.or{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px;padding:12px 0;border-bottom:1px solid var(--ln)}.or small{display:block;color:var(--mu);font-size:12px}
.sg{display:inline-flex;border:1px solid var(--ln);background:var(--sf);border-radius:var(--rad);overflow:hidden}.sg button{padding:8px 14px;font-weight:700;font-size:14px}.sg button.on{background:var(--red);color:#000}
.oc{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.tc{border:2px solid var(--ln);background:var(--sf);padding:6px;font-weight:700;font-size:13px;border-radius:var(--rad)}.tc.on{border-color:var(--red)}
.tc i{display:block;height:46px;margin-bottom:6px;position:relative;border:1px solid #8885}.tc s{position:absolute;inset:8px 8px auto;height:16px}.tc u{position:absolute;inset:auto 8px 8px;height:4px;width:40%}
.sw{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.sw button{width:40px;height:40px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 2px var(--ln)}.sw button.on{box-shadow:0 0 0 3px var(--fg)}.sw input{width:56px}
.nt{border:1px solid var(--ln);background:var(--sf);padding:12px 14px;font-size:13.5px;color:var(--mu);margin-top:18px;border-radius:var(--rad)}
/* العملاء، التسويق، تصاميم المتجر، السجل */
.cr{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:start;padding:12px 14px;background:var(--sf);border:1px solid var(--ln);margin-bottom:8px;border-radius:var(--rad)}
.cr:hover{border-color:var(--red)}
.cr .av{display:grid;place-items:center;width:44px;height:44px;background:var(--red);color:#000;font-weight:900;font-size:18px;transform:skewX(-8deg)}
.cr small{display:block;color:var(--mu);font-size:12.5px}.cr b.lat{font-size:26px;direction:ltr}
.cp{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 14px;background:var(--sf);border:1px dashed var(--ln);margin-bottom:8px;border-radius:var(--rad)}
.cp b.lat{font-size:26px;letter-spacing:.06em;direction:ltr}.cp .pc{background:var(--red);color:#000;font-weight:900;padding:1px 10px}
.cp .sp{flex:1}.cp.off{opacity:.5}
.rvw{padding:14px;background:var(--sf);border:1px solid var(--ln);margin-bottom:8px;border-radius:var(--rad)}
.rvw q{display:block;margin-bottom:8px}.rvw small{color:var(--mu)}.rvw div{display:flex;justify-content:space-between;align-items:center;gap:10px}
.inl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 14px;align-items:end}
.dz{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dc{position:relative;border:2px solid var(--ln);background:var(--sf);padding:6px;font-weight:700;font-size:14px;text-align:start;border-radius:var(--rad)}
.dc.on{border-color:var(--red)}.dc.on:after{content:"مفعّل";position:absolute;top:12px;inset-inline-start:12px;background:var(--red);color:#000;font-size:11px;font-weight:900;padding:1px 7px}
.dc i{display:grid;place-items:center;height:84px;margin-bottom:6px;overflow:hidden;position:relative;font:400 26px/1 'Bebas Neue',Impact,sans-serif;font-style:normal;letter-spacing:.03em;direction:ltr}
.dc i u{text-decoration:none}
.dc small{display:block;font-weight:400;font-size:12px;color:var(--mu)}
.lgr{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--ln);font-size:14px}.lgr small{color:var(--mu);white-space:nowrap}
/* الإيصال ونتيجة الفحص */
.rc img{display:block;max-width:100%;max-height:340px;margin:0 auto 12px;border:1px solid var(--ln);background:#fff}
.vd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;font-weight:900;border:2px solid currentColor;margin-bottom:8px}
.vd.ok{color:var(--ok)}.vd.review{color:#d99a1c}.vd.sus{color:var(--rt)}.vd b{font-size:24px}
.ck{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--ln);font-size:14px}
.ck i{font-style:normal;font-weight:900;text-align:center}.ck.ok i{color:var(--ok)}.ck.warn i{color:#d99a1c}.ck.fail i{color:var(--rt)}.ck.info i{color:var(--mu)}
.ck small{display:block;color:var(--mu)}
.vt{font-style:normal;font-size:11px;font-weight:900;padding:1px 7px;vertical-align:middle;border:1px solid currentColor}
.vt.ok{color:var(--ok)}.vt.review{color:#d99a1c}.vt.sus{color:var(--rt)}
#eye,#dim{position:fixed;inset:0;z-index:60;pointer-events:none}#eye{background:#ff9d2e;mix-blend-mode:multiply;opacity:var(--eye)}#dim{background:#000;opacity:var(--dim)}

:root[data-ds=soft]{--rad:18px}:root[data-ds=calm]{--rad:8px}
:root[data-ds=soft] :is(.hero,.tk,.pt,.cd){box-shadow:0 8px 24px #0002}
:root[data-ds]:not([data-ds=rox]) .hero:before{display:none}
:root[data-ds]:not([data-ds=rox]) :is(.nb:before,.b,.ks>div:before,.hh:before,.tp i){transform:none}
:root[data-ds=calm] .hero{background:transparent;color:var(--fg);border:2px solid var(--red)}
:root[data-ds=calm] .seg button{border-color:var(--ln);color:var(--fg)}:root[data-ds=calm] .seg button.on{background:var(--red);border-color:var(--red);color:#000}
:root[data-ds=calm] .hero text{fill:var(--mu)}:root[data-ds=calm] .b{fill:var(--red)}:root[data-ds=calm] .b.t{fill:var(--fg)}:root[data-ds=calm] .num{color:var(--rt)}
:root[data-dn=c] .tk .in{padding:8px 12px}:root[data-dn=c] .sb{padding:6px 12px;gap:3px}:root[data-dn=c] .tk{margin-bottom:6px}:root[data-dn=c] .hh{margin:18px 0 8px}:root[data-dn=c] .ks{margin-top:16px}:root[data-dn=c] .tp{margin-bottom:6px}:root[data-dn=c] .pg{gap:8px}
:root[data-mo=off] *{animation:none!important;transition:none!important}

@media(min-width:700px){.ks{grid-template-columns:repeat(4,1fr)}}
@media(min-width:860px){.app{grid-template-columns:240px minmax(0,1fr)}
.sd{display:flex;flex-direction:column;position:sticky;top:0;height:100svh;padding:28px 14px;background:#000;color:#efeae2}
.sd:after{content:"";position:absolute;top:0;bottom:0;inset-inline-end:0;width:2px;background:linear-gradient(var(--red),transparent 60%)}
.sd .lg{margin:0 8px 24px;font-size:40px;justify-content:flex-end}
.sd .nb{flex-direction:row;gap:12px;padding:13px 16px;font-size:16px;color:#938d85}.sd .nb.on{color:#000}
.sd .nb small{display:block;margin-inline-start:auto;font-size:11px;font-weight:400}

/* ============ المظهر ============ */
const TH = [['auto','تلقائي'],['light','فاتح','#efeae2','#ffffff','#14110f','#6b655e','#d5cec2',0],['paper','ورقي','#f4f6f9','#ffffff','#0f172a','#5b6577','#dde2ea',0],['dark','داكن','#0b0a09','#141211','#efeae2','#938d85','#2a2725',1],['black','أسود','#000000','#0d0d0d','#f2f2f2','#9a9a9a','#262626',1],['navy','ليلي','#0a0f1c','#111a2e','#e6ecf8','#8d9bb8','#1f2b45',1]],

const lum = h => { const c = [1, 3, 5].map(i => { const v = parseInt(h.substr(i, 2), 16) / 255; return v <= .04045 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };

const mix = (h, t, p) => '#' + [1, 3, 5].map(i => { const a = parseInt(h.substr(i, 2), 16), b = parseInt(t.substr(i, 2), 16); return ('0' + Math.round(a + (b - a) * p).toString(16)).slice(-2); }).join('');
function tone(h, bg, to) { let k = 0, c = h; while (cr(c, bg) < 4.5 && k < 14) { k++; c = mix(h, to, k * .06); } return c; }
function ap() { const r = document.documentElement, s = r.style, t = TH.find(x => x[0] == OP.th) || TH[0], ex = t.length > 2, dk = ex ? !!t[7] : matchMedia('(prefers-color-scheme:dark)').matches, bg = ex ? t[2] : dk ? '#0b0a09' : '#efeae2', a = tone(OP.ac, '#000000', '#ffffff');
  ['bg', 'sf', 'fg', 'mu', 'ln'].forEach((n, i) => ex ? s.setProperty('--' + n, t[i + 2]) : s.removeProperty('--' + n));

const rw = (t, s, c) => `<div class="or"><div>${t}<small>${s}</small></div>${c}</div>`;
function apv() { return dzv() + hero() + (DB.orders[0] ? row(DB.orders[0], 1) : '')
  + `<div class="hh">الثيم</div><div class="oc">${TH.map(t => { const x = t.length > 2; return `<button class="tc${OP.th == t[0] ? ' on' : ''}" data-o="th" data-v="${t[0]}"><i style="background:${x ? t[2] : 'linear-gradient(90deg,#efeae2 50%,#0b0a09 50%)'}">${x ? `<s style="background:${t[3]}"></s><u style="background:${t[4]}"></u>` : ''}</i>${t[1]}</button>`; }).join('')}</div>`
  + `<div class="hh">لون التمييز</div><div class="sw">${AC.map(a => `<button data-o="ac" data-v="${a[0]}" aria-label="${a[1]}" style="background:${a[0]}" class="${OP.ac == a[0] ? 'on' : ''}"></button>`).join('')}<input type="color" id="cc" value="${OP.ac}" aria-label="لون مخصص"></div>`
  + '<div class="hh">التصميم</div>' + rw('نمط التصميم', 'ROX حاد ومائل، ناعم مدوّر بظلال، هادئ بإطار خفيف', sg('ds', [['rox', 'ROX'], ['soft', 'ناعم'], ['calm', 'هادئ']]))
  + rw('الكثافة', 'مسافات الطلبات والقوائم', sg('dn', [['r', 'مريحة'], ['c', 'مضغوطة']]))
  + rw('حجم الخط', 'يكبّر أو يصغّر محتوى الصفحة', sg('fz', [['.9', 'صغير'], ['1', 'عادي'], ['1.12', 'كبير']]))
  + rw('الحركة', 'العدّ والرسم التدريجي', sg('mo', [['on', 'تشغيل'], ['off', 'إيقاف']]))
  + '<div class="hh">راحة العين</div>' + rw('وضع راحة العين', 'لون دافئ يقلل الضوء الأزرق', sg('ey', [['0', 'إيقاف'], ['1', 'خفيف'], ['2', 'متوسط'], ['3', 'قوي']]))
  + rw('تعتيم الشاشة', 'يخفف السطوع في الأماكن المظلمة', `<input type="range" id="dm" min="0" max="50" value="${OP.dm}" aria-label="تعتيم الشاشة" style="width:min(100%,220px)">`)
  + '<button class="bt" data-o="rs0">إعادة ضبط المظهر</button>'; }

/* ============ التنقل ============ */
const VW = [ovv, ord, prd, cus, mkt, sev, apv];
function nav() { const h = TB.map((t, i) => { const n = i == 1 ? cnt() : 0; return `<button class="nb${i == at ? ' on' : ''}" data-t="${i}">${ic(t[2])}<span>${t[0]}</span>${n ? `<em>${n}</em>` : ''}<small class="lat">${t[1]}</small></button>`; }).join(''); $('nv').innerHTML = h; $('tb').innerHTML = h; }
function tab(i, na) { at = i; $('ttl').textContent = TB[i][0]; const v = $('v'); v.className = (i == 2 ? 'pg ' : '') + (na ? 'na' : '');
  v.innerHTML = (CFG.maint ? `<div class="mn" role="status">${ic('warn', 's')}وضع الصيانة مفعّل. المتجر مغلق للزوار.</div>` : '') + VW[i](); nav();
  v.querySelectorAll('.cu').forEach(e => { if (na || RM || OP.mo == 'off') e.textContent = (+e.dataset.v).toLocaleString('en-US'); else cu(e); }); }
$('nv').onclick = $('tb').onclick = e => { const b = e.target.closest('.nb'); if (b) { tab(+b.dataset.t); scrollTo(0, 0); } };
$('v').addEventListener('input', e => { const t = e.target; if (t.id == 'q') { qs = t.value; $('ol').innerHTML = ol(); } else if (t.id == 'cc') { OP.ac = t.value; ap(); put('rox_ui', OP); } else if (t.id == 'dm') { OP.dm = t.value; ap(); put('rox_ui', OP); } });
$('v').addEventListener('change', e => { if (e.target.id == 'cc') tab(at, 1); });
$('v').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const s = b.dataset; let o;
  if (at == 4 && mka(b, s)) return;
  if (s.cu != null) { qs = s.cu; flt = -1; tab(1, 1); scrollTo(0, 0); }
  else if (s.dz) { CFG.design = s.dz; saveC(); lg('تغيير تصميم المتجر: ' + DZ.find(d => d[0] == s.dz)[1]); tab(at, 1); toast('تم تفعيل التصميم على المتجر'); }
  else if (s.dzp) window.open('rox-fivem-store.html?design=' + s.dzp, '_blank', 'noopener');
  else if (s.r) { rg = +s.r; tab(at); }
  else if (s.f) { flt = +s.f; tab(1, 1); }
  else if (s.o) opt(s.o, s.v);
  else if (s.od) od1(s.od);
  else if (s.mt != null) mt(s.mt);
  else if (s.id) { o = oid(s.id); o.st = (o.st + 1) % 3; o.status = STN[o.st]; saveOrder(o); lg(`طلب #${o.id}: ${ST[o.st]}`); tab(at, 1); toast('الحالة الآن: ' + ST[o.st]); }
  else if (s.del != null) cf(b, () => { delOrder(s.del); lg('حذف طلب #' + s.del); tab(1, 1); toast('تم حذف الطلب'); });
  else if (s.e != null) fo(+s.e);
  else if (s.x != null) cf(b, () => { lg('حذف منتج: ' + P[+s.x].name); P.splice(+s.x, 1); saveP(); tab(2, 1); toast('تم حذف المنتج'); });
  else if (b.id == 'np') fo(-1);
  else if (b.id == 'ss') ss();
  else if (b.id == 'ex') { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(P, null, 2)], { type:'application/json' })); a.download = 'rox-products.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); } });

/* ============ نافذة الطلب ============ */
let oe = null, wi = [];
const pri = n => (P.find(x => x.name == n) || {}).price || 0;
function irs() { const nm = P.map(p => p.name); return wi.map((x, i) => { const op = nm.includes(x.n) ? nm : [x.n].concat(nm);
  return `<div class="ir"><select class="ip" aria-label="المنتج">${op.map(n => `<option${n == x.n ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select><input class="iq" type="number" min="1" value="${x.q}" aria-label="الكمية"><button data-ix="${i}" aria-label="حذف المنتج">${ic('trash', 's')}</button></div>`; }).join(''); }
function rd() { wi = [...document.querySelectorAll('#il .ir')].map(r => { const n = r.querySelector('.ip').value, old = wi.find(x => x.n == n); return { n, p: pri(n) || (old ? old.p : 0), q: Math.max(1, +r.querySelector('.iq').value || 1) }; }); }
function od1(id) { oe = id == 'new' ? null : oid(id); const o = oe || { items: [], st: 0, pay: 'bank' };
  wi = o.items.map(x => ({ n: x.n, p: x.p, q: x.q })); if (!wi.length && P[0]) wi.push({ n: P[0].name, p: P[0].price, q: 1 });
  $('ob').innerHTML = `<h2>${oe ? 'طلب #' + oe.id : 'طلب جديد'}</h2>${oe ? `<p class="hint">${esc(oe.ref)} · ${new Date(oe.t).toLocaleString('ar-u-nu-latn', { dateStyle:'medium', timeStyle:'short' })}${emailOf(oe.uid) ? ' · ' + esc(emailOf(oe.uid)) : ''}</p>` : ''}
    ${oe && oe.rp ? `<div class="rc"><div class="hh" style="margin-top:6px">الإيصال</div><a id="rci" target="_blank" rel="noopener"><img alt="صورة الإيصال" id="rcimg"></a><div id="rcr">${chkHtml(oe.chk)}</div>
      <button class="bt p" data-rck="1">${ic('search', 's')}فحص الإيصال</button><button class="bt" data-rok="1">قبول وتسليم</button><button class="bt" data-rno="1">رفض الإيصال</button><div class="hh">بيانات الطلب</div></div>` : ''}
    <div class="f2"><label>اسم العميل (ديسكورد)<input id="on" value="${esc(o.cu || '')}"></label><label>حساب Cfx.re أو الإيميل<input id="op" dir="ltr" value="${esc(o.cfx || '')}"></label></div>
    <div class="f2"><label>طريقة الدفع<select id="oy">${PAY.map(x => `<option value="${x[0]}"${o.pay == x[0] ? ' selected' : ''}>${x[1]}</option>`).join('')}</select></label><label>الحالة<select id="ost">${ST.map((s, i) => `<option value="${i}"${o.st == i ? ' selected' : ''}>${s}</option>`).join('')}</select></label></div>
    <label>ملاحظات<textarea id="ot" rows="2">${esc(o.nt || '')}</textarea></label>
    <div class="hh">المنتجات</div><div id="il">${irs()}</div><button class="bt" data-oa="1">${ic('plus', 's')}منتج</button>
    <label style="margin-top:14px">الإجمالي (${esc(CFG.currency)})<input id="otl" type="number" inputmode="decimal" step="0.01" dir="ltr" value="${o.total || ''}"></label>
    <button class="bt" data-oc="1">احسب الإجمالي من المنتجات</button><small class="er" id="oer" role="alert"></small>
    <button class="bt p" data-os="1">حفظ الطلب</button><button class="bt" data-ox="1">إغلاق</button>${oe ? `<button class="bt" data-odl="1">${ic('trash', 's')}حذف الطلب</button>` : ''}`;
  $('os').classList.add('on');
  if (oe && oe.rp) sb.storage.from('receipts').createSignedUrl(oe.rp, 600).then(({ data }) => { if (data && $('rcimg')) { $('rcimg').src = data.signedUrl; $('rci').href = data.signedUrl; } }); }

/* ============ فحص الإيصال ============ */
function chkHtml(c) {
  if (!c) return '<p class="hint">الإيصال ما انفحص بعد. اضغط «فحص الإيصال».</p>';
  const m = { ok:'✓', warn:'!', fail:'✕', info:'·' };
  return `<div class="vd ${c.verdict}"><span>نتيجة الفحص: ${esc(c.label)}</span><b class="lat">${+c.score}%</b></div>`
    + c.checks.map(x => `<div class="ck ${x.st}"><i>${m[x.st]}</i><div><strong>${esc(x.label)}</strong><small>${esc(x.detail)}</small></div></div>`).join('')
    + '<p class="hint" style="margin-top:8px">الفحص مساعد للمراجعة وليس إثباتًا. تأكد من وصول المبلغ في كشف حسابك قبل التسليم.</p>';
}
const loadOcr = () => window.Tesseract ? Promise.resolve() : new Promise((ok, no) => { const t = document.createElement('script'); t.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'; t.onload = ok; t.onerror = no; document.head.append(t); });
async function runCheck(o) {
  const out = $('rcr'); out.innerHTML = '<p class="hint">جاري قراءة الإيصال… أول مرة تأخذ وقت أطول لتحميل محرك القراءة.</p>';
  try {
    const blob = await run(sb.storage.from('receipts').download(o.rp), 'تعذّر تحميل الإيصال'), buf = await blob.arrayBuffer();
    const hash = await RoxReceipt.sha256(buf), bmp = await createImageBitmap(blob).catch(() => null);
    const dup = DB.orders.find(x => x !== o && (x.rh == hash || (x.chk && x.chk.hash == hash)));
    await loadOcr(); const w = await Tesseract.createWorker(['ara', 'eng']); const { data } = await w.recognize(blob); await w.terminate();
    const r = RoxReceipt.analyze(data.text, { expectedSar: o.total * (+CFG.sarRate || 3.75), expectedUsd: o.total, iban: CFG.bank.iban, account: CFG.bank.account, holder: CFG.bank.holder, orderAt: o.t,
      dupHashOrder: dup ? dup.id : 0, usedRefs: DB.orders.filter(x => x !== o && x.chk && x.chk.ref).map(x => x.chk.ref), software: RoxReceipt.fileSoftware(buf), imgW: bmp && bmp.width, imgH: bmp && bmp.height });
    o.chk = { verdict: r.verdict, label: r.label, score: r.score, checks: r.checks, ref: r.ref, hash, at: r.at };
    await saveOrder(o); lg(`فحص إيصال الطلب #${o.id}: ${r.label}`); if ($('rcr')) $('rcr').innerHTML = chkHtml(o.chk);
  } catch (e) { console.error(e); if ($('rcr')) $('rcr').innerHTML = '<p class="er">تعذّر فحص الإيصال. تأكد من الاتصال وحاول مرة ثانية.</p>'; }
}
async function osv() { rd(); const tl = +$('otl').value; if (!wi.length || !(tl > 0)) { $('oer').textContent = 'أضف منتجًا واحدًا على الأقل وإجمالي أكبر من صفر.'; return; }
  const st = +$('ost').value, d = { cu: clean($('on').value), cfx: clean($('op').value), nt: clean($('ot').value), pay: $('oy').value, st, items: wi, total: +tl.toFixed(2) };
  d.status = oe && stIdx(oe.status) == st ? oe.status : STN[st];
  try {
    if (oe) { Object.assign(oe, d); await saveOrder(oe); }
    else { const row = await run(sb.from('orders').insert({ ref: 'ROX-' + Math.random().toString(36).slice(2, 8).toUpperCase(), cu: d.cu, cfx: d.cfx, note: d.nt, pay: d.pay, status: d.status, items: d.items, subtotal: d.total, total: d.total }).select().single());
      DB.orders.unshift(fromOrder(row)); }
  } catch (e) { return; }
  lg((oe ? 'تعديل طلب #' : 'طلب جديد #') + (oe ? oe.id : DB.orders[0].id)); $('os').classList.remove('on'); tab(at, 1); toast(oe ? 'تم حفظ التعديلات' : 'تمت إضافة الطلب'); }
$('ob').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const s = b.dataset;
  if (s.oa) { rd(); wi.push({ n: P[0] ? P[0].name : '', p: P[0] ? P[0].price : 0, q: 1 }); $('il').innerHTML = irs(); }
  else if (s.ix != null) { rd(); wi.splice(+s.ix, 1); $('il').innerHTML = irs(); }
  else if (s.oc) { rd(); $('otl').value = wi.reduce((t, x) => t + x.p * x.q, 0).toFixed(2); }
  else if (s.ox) $('os').classList.remove('on');
  else if (s.rck) runCheck(oe);
  else if (s.rok || s.rno) { oe.status = s.rok ? 'delivered' : 'rejected'; oe.st = stIdx(oe.status); saveOrder(oe); lg(`طلب #${oe.id}: ${s.rok ? 'قبول الإيصال والتسليم' : 'رفض الإيصال'}`); $('os').classList.remove('on'); tab(at, 1); toast(s.rok ? 'تم قبول الطلب' : 'تم رفض الإيصال'); }
  else if (s.odl) cf(b, () => { delOrder(oe.id); $('os').classList.remove('on'); tab(at, 1); toast('تم حذف الطلب'); });
  else if (s.os) osv(); });
document.querySelectorAll('.ov').forEach(o => o.onclick = e => { if (e.target === o) o.classList.remove('on'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('sh').classList.remove('on'); $('os').classList.remove('on'); $('mp').hidden = true; } });

/* ============ القفل ============ */
$('vs').innerHTML = ic('ext', 's') + 'المتجر'; $('lo').innerHTML = ic('lock', 's') + 'خروج';
let mode = 'login', firstPw = '';
const MSG = { login:'سجّل دخولك بالإيميل وكلمة المرور', pin:'أدخل كلمة المرور الثانية', setpin:'سجّل كلمة مرور ثانية للوحة (8 أحرف أو أكثر، ومختلفة عن الأولى). بتنطلب منك بعد كل تسجيل دخول.',
  denied:'هذا الحساب ما له صلاحية على لوحة التحكم.', setup:'اللوحة تحتاج ربط Supabase: حط رابط المشروع والمفتاح العام في ملف rox-config.js' };
function lockUI(m, msg) { mode = m; $('app').hidden = true; $('lk').hidden = false;
  $('lem').hidden = $('lpw').hidden = m != 'login'; $('pin').hidden = !(m == 'pin' || m == 'setpin'); $('pin2').hidden = m != 'setpin';
  $('go').hidden = m == 'denied' || m == 'setup'; $('lout').hidden = m == 'login' || m == 'setup';
  $('lmsg').textContent = MSG[m]; $('go').textContent = m == 'login' ? 'دخول' : m == 'setpin' ? 'حفظ ودخول' : 'فتح القفل'; $('le').textContent = msg || '';
  $('pin').value = $('pin2').value = $('lpw').value = ''; const f = $(m == 'login' ? 'lem' : 'pin'); if (!f.hidden) f.focus(); }
const lockedMsg = t => t && Date.parse(t) > Date.now() ? `اللوحة مقفولة مؤقتًا. حاول بعد ${Math.ceil((Date.parse(t) - Date.now()) / 6e4)} دقيقة.` : '';
async function route() {
  const { data: { session } } = await sb.auth.getSession(); if (!session) return lockUI('login');
  const { data: st, error } = await sb.rpc('admin_state'); if (error || !st) return lockUI('login', 'تعذّر الاتصال بقاعدة البيانات.');
  if (!st.admin) return lockUI('denied'); if (!st.has_pin) return lockUI('setpin'); if (!st.unlocked) return lockUI('pin', lockedMsg(st.locked_until));
  try { await loadAll(); } catch (e) { return lockUI('pin', 'تعذّر تحميل البيانات.'); }
  firstPw = ''; $('lk').hidden = true; $('app').hidden = false; tab(0); }
$('lf').onsubmit = async e => { e.preventDefault(); if (!sb) return; const b = $('go'), err = m => { $('le').textContent = m; }; b.disabled = true;
  try {
    if (mode == 'login') { const pw = $('lpw').value, { error } = await sb.auth.signInWithPassword({ email: $('lem').value.trim(), password: pw });
      if (error) return lockUI('login', 'الإيميل أو كلمة المرور غلط.'); firstPw = pw; await route(); }
    else if (mode == 'setpin') { const p = $('pin').value;
      if (p.length < 8) return err('لازم 8 أحرف أو أكثر.'); if (p !== $('pin2').value) return err('الكلمتين مو متطابقتين.'); if (firstPw && p === firstPw) return err('لازم تكون مختلفة عن كلمة المرور الأولى.');
      const { error } = await sb.rpc('admin_set_pin', { new_pin: p }); if (error) return err('تعذّر الحفظ. حاول مرة ثانية.'); await route(); }
    else if (mode == 'pin') { const { data, error } = await sb.rpc('admin_unlock', { pin: $('pin').value }); if (error || !data) return err('تعذّر التحقق. حاول مرة ثانية.');
      if (!data.ok) return lockUI('pin', lockedMsg(data.locked_until) || `كلمة المرور الثانية غلط. باقي ${data.left} محاولات.`); await route(); }
  } finally { b.disabled = false; } };
async function logout() { try { await sb.rpc('admin_lock'); } catch (e) {} try { await sb.auth.signOut(); } catch (e) {}
  P = []; DB = { orders: [], log: [] }; CUS = []; $('v').innerHTML = ''; firstPw = ''; lockUI('login'); }
$('lo').onclick = $('lout').onclick = logout;
matchMedia('(prefers-color-scheme:dark)').addEventListener('change', ap);
ap(); if (sb) route(); else lockUI('setup');

</script>
</body>
</html>
